
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Mavin's iPhone</title>
<style>
*{box-sizing:border-box}
:root{--blue:#087cff;--paper:#f4f4f7;--ink:#171719}
body{margin:0;background:#111;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{border:0;cursor:pointer}
#phone{width:100%;max-width:430px;height:100vh;height:100dvh;margin:auto;position:relative;overflow:hidden;background:#080808;isolation:isolate}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.active{display:block}
#wall{position:absolute;inset:0;background:#161616 url('https://raw.githubusercontent.com/runweebss/Interactive-Winrina-AU/main/camera-wallpaper.jpg') center center/cover no-repeat;z-index:0}
.status{position:absolute;top:9px;left:7%;right:7%;z-index:3;display:flex;justify-content:space-between;font-size:14px;font-weight:700;text-shadow:0 1px 5px #000;pointer-events:none}
.homebar{position:absolute;z-index:12;bottom:5px;left:calc(50% - 50px);width:100px;height:4px;border-radius:5px;background:#ffffffc9;pointer-events:none}

/* LOCK SCREEN: terpisah dari home screen */
#lock{z-index:8;background:#000}
#lock img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lockdate{position:absolute;top:7%;width:100%;text-align:center;font-size:16px;text-shadow:0 1px 5px #000}
.locktime{position:absolute;top:10%;width:100%;text-align:center;font-size:clamp(64px,18vw,82px);font-weight:250;letter-spacing:1px;text-shadow:0 1px 5px #000}
#unlock{position:absolute;bottom:7%;left:0;width:100%;padding:16px;background:transparent;color:#f6d9a5;text-shadow:0 1px 5px #000;font-size:16px}
#pin{position:absolute;inset:0;z-index:11;display:none;text-align:center;background:#080808f5;padding-top:20%}
#pin.show{display:block}
#pin h2{font-weight:400}
#dots{font-size:24px;letter-spacing:8px}
#error{height:20px;color:#ff9999;font-size:13px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(280px,80%);margin:20px auto}
.keypad button{aspect-ratio:1;border-radius:50%;border:1px solid #ffffff35;background:#ffffff19;color:white;font-size:24px}

/* HOME SCREEN */
#home{z-index:2;background:transparent}
#home.active{display:block}
.home-status{position:absolute;top:8px;left:7%;right:7%;z-index:2;display:flex;justify-content:space-between;font-size:14px;font-weight:700;text-shadow:0 1px 5px #000;pointer-events:none}
.weather{
 position:absolute;top:12.5%;left:9%;width:82%;height:19%;
 border-radius:27px;padding:14px 16px;
 color:white;text-align:left;
 background:linear-gradient(140deg,#607385ed,#253746f2);
 box-shadow:0 8px 25px #0002;overflow:hidden
}
.city{font-size:16px;font-weight:600}
.temp{font-size:clamp(44px,12vw,58px);font-weight:250;line-height:1.05;margin-top:3px}
.desc{position:absolute;right:14px;top:43%;text-align:right;font-size:13px;line-height:1.35}
.hours{position:absolute;bottom:10px;left:10px;right:10px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));text-align:center;gap:1px;font-size:9px;color:#f5f5f5}
.hours b{display:block;font-size:15px;margin:3px 0}
.weather-label{position:absolute;top:31.8%;left:0;width:100%;text-align:center;font-size:12px;text-shadow:0 1px 5px #000}
.app-grid{
 position:absolute;top:35.5%;left:8%;width:84%;
 display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
 grid-template-rows:repeat(3,auto);row-gap:15px;column-gap:4px;
}
.app{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;min-width:0;padding:0;background:transparent;color:white;text-shadow:0 1px 4px #000}
.app .ico{width:clamp(48px,15vw,64px);aspect-ratio:1;border-radius:16px;display:grid;place-items:center;font-size:29px;box-shadow:0 3px 8px #0003;overflow:hidden}
.app label{font-size:11px;line-height:1.1;white-space:nowrap}
.wa{background:#20ce69}.calendar{background:#fff;color:#111;display:flex;flex-direction:column;justify-content:center;line-height:1}.calendar small{font-size:10px;color:#d22}.calendar strong{font-size:27px}
.ig{background:radial-gradient(circle at 30% 100%,#ffd66d,#f34c5e 48%,#8238ce)}
.xicon{background:#000;font-size:29px}.spotify{background:#101010;color:#1ed760}.photos{background:#fff;color:#ee765d}.notesico{background:linear-gradient(#ffd34d 20%,#fff 20%);color:#999}.yt{background:#fff;color:#e00}
.app[data-app="WhatsApp"]{grid-column:1;grid-row:1}
.app[data-app="Calendar"]{grid-column:2;grid-row:1}
.app[data-app="Instagram"]{grid-column:1;grid-row:2}
.app[data-app="X"]{grid-column:2;grid-row:2}
.app[data-app="Spotify"]{grid-column:1;grid-row:3}
.app[data-app="Photos"]{grid-column:2;grid-row:3}
.app[data-app="Notes"]{grid-column:3;grid-row:3}
.app[data-app="YouTube"]{grid-column:4;grid-row:3}

/* WIDGET MUSIK MENGAMBANG DI KANAN */
.music-widget{
 position:absolute;z-index:3;left:53%;top:35.5%;width:40%;height:27%;
 border-radius:24px;background:#242426ed;color:white;
 padding:12px;backdrop-filter:blur(18px);box-shadow:0 8px 25px #0004;
 text-align:left;overflow:hidden
}
.album{width:55px;height:55px;border-radius:9px;background:linear-gradient(135deg,#bbb,#333);display:grid;place-items:center;font-size:28px;margin-bottom:8px}
.music-title{font-size:13px;font-weight:700;line-height:1.25}
.music-artist{font-size:12px;color:#ccc;margin-top:4px}
.music-bar{height:4px;border-radius:4px;background:#777;margin:12px 0 5px}
.music-bar span{display:block;width:46%;height:100%;background:#fff}
.music-time{display:flex;justify-content:space-between;font-size:9px;color:#eee}
.music-controls{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.music-controls button{padding:0;background:none;color:white;font-size:15px}
.pages{position:absolute;bottom:12.5%;left:0;width:100%;display:flex;justify-content:center;gap:12px;align-items:center}
.pages span{width:7px;height:7px;border:1px solid white;border-radius:50%;opacity:.9}
.pages span:first-child{background:white}
.dock{
 position:absolute;z-index:5;bottom:3.5%;left:5%;right:5%;height:8.5%;
 min-height:62px;max-height:78px;border-radius:28px;
 background:#d4c5addd;backdrop-filter:blur(22px);
 display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:7px
}
.dock .app .ico{width:clamp(45px,13vw,58px);border-radius:14px}
.dock .app label{display:none}

/* APP SCREENS */
#app{z-index:7;background:var(--paper);color:var(--ink);overflow-y:auto;overscroll-behavior:contain;padding-bottom:28px}
.topbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;padding:14px 16px;background:#f8f8f9f2;backdrop-filter:blur(16px);border-bottom:1px solid #ddd}
.topbar button{background:transparent;color:var(--blue)}
.topbar strong{font-size:18px}
.content{padding:16px}
.card{background:#fff;color:#222;border-radius:17px;padding:15px;margin-bottom:13px;box-shadow:0 1px 2px #00000006}
.muted{color:#777}
.field{display:block;width:100%;padding:13px;border:1px solid #d2d2d7;border-radius:12px;background:#fff;color:#111;margin:7px 0 12px;outline-color:var(--blue)}
.primary{background:var(--blue);color:#fff;border-radius:12px;padding:12px 16px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid #ddd;background:transparent;color:#222}
.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#e1e1e5;flex-shrink:0;font-size:22px}
.bubble{padding:10px 13px;border-radius:17px;background:#e4e4e9;color:#111;margin:8px 0;max-width:85%;overflow-wrap:anywhere}
.bubble.me{margin-left:auto;background:#a4e8a0}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.photo-grid button{aspect-ratio:1;background:linear-gradient(140deg,#d4b69a,#526270);font-size:30px}
.notice{font-size:12px;color:#777}
.hide{display:none!important}
@media(max-height:740px){
 .weather{top:11.5%;height:18%}
 .weather-label{top:29.8%}
 .app-grid{top:33.5%;row-gap:11px}
 .music-widget{top:33.5%;height:27%}
 .pages{bottom:11.5%}
 .dock{bottom:3%;height:8%}
}
@media(max-width:370px){
 .weather{left:7%;width:86%;padding:11px}
 .hours{font-size:8px;left:7px;right:7px}
 .desc{font-size:11px}
 .app-grid{left:6%;width:88%}
 .app .ico{width:48px;border-radius:13px}
 .app label{font-size:10px}
 .music-widget{left:52%;width:42%;padding:9px}
 .album{width:45px;height:45px}
 .music-title{font-size:12px}
}
@media(min-width:600px){
 #phone{height:min(900px,100dvh);border:4px solid #222;border-radius:30px}
}
</style>
</head>
<body>
<div id="phone">
<div id="wall"></div>

<section id="lock" class="screen active">
 <img src="alohomora-lockscreen.jpg" alt="Alohomora lock screen" onerror="this.style.display='none'">
 <div class="lockdate" id="date"></div>
 <div class="locktime" id="lockclock">11:11</div>
 <button id="unlock">↑ &nbsp; swipe up to unlock</button>
</section>

<section id="home" class="screen">
 <div class="home-status"><span id="clock">11:11</span><span>▮▮▮ ◉ ▰</span></div>
 <button class="weather" data-app="Weather">
  <div class="city">Bandung</div>
  <div class="temp">61°</div>
  <div class="desc">☁<br>Cloudy<br>H:62° L:52°</div>
  <div class="hours">
   <div>2PM<b>☁</b>61°</div><div>3PM<b>☁</b>62°</div>
   <div>4PM<b>☁</b>61°</div><div>5PM<b>☁</b>62°</div>
   <div>6PM<b>☁</b>62°</div><div>7PM<b>☁</b>61°</div>
  </div>
 </button>
 <div class="weather-label">Weather</div>

 <div class="app-grid">
  <button class="app" data-app="WhatsApp"><span class="ico wa">☎</span><label>WhatsApp</label></button>
  <button class="app" data-app="Calendar"><span class="ico calendar"><small id="day">THU</small><strong id="num">29</strong></span><label>Calendar</label></button>
  <button class="app" data-app="Instagram"><span class="ico ig">◎</span><label>Instagram</label></button>
  <button class="app" data-app="X"><span class="ico xicon">𝕏</span><label>X</label></button>
  <button class="app" data-app="Spotify"><span class="ico spotify">●</span><label>Spotify</label></button>
  <button class="app" data-app="Photos"><span class="ico photos">✿</span><label>Photos</label></button>
  <button class="app" data-app="Notes"><span class="ico notesico">▤</span><label>Notes</label></button>
  <button class="app" data-app="YouTube"><span class="ico yt">▶</span><label>YouTube</label></button>
 </div>

 <div class="music-widget">
  <button data-app="Music" style="display:block;background:none;padding:0;text-align:left;color:white;width:100%">
   <div class="album">♫</div>
   <div class="music-title">everything u are</div>
   <div class="music-artist">Hindia</div>
  </button>
  <div class="music-bar"><span id="progress"></span></div>
  <div class="music-time"><span>1:53</span><span>−2:04</span></div>
  <div class="music-controls">
   <button data-control="prev">◀◀</button>
   <button data-control="play">▶</button>
   <button data-control="next">▶▶</button>
  </div>
 </div>

 <div class="pages"><span></span><span></span><span></span></div>
 <div class="dock">
  <button class="app" data-app="Camera"><span class="ico" style="background:#e5e5e9;color:#222">📷</span><label>Camera</label></button>
  <button class="app" data-app="Calculator"><span class="ico" style="background:#e5e5e9;color:#222">🧮</span><label>Calculator</label></button>
  <button class="app" data-app="Gmail"><span class="ico" style="background:#fff;color:#d44">✉</span><label>Gmail</label></button>
  <button class="app" data-app="Settings"><span class="ico" style="background:#e5e5e9;color:#222">⚙</span><label>Settings</label></button>
 </div>
</section>

<section id="app" class="screen">
 <div class="topbar"><button id="back">‹ Home</button><strong id="title">App</strong><span style="flex:1"></span><button id="lockBtn">Lock</button></div>
 <div class="content" id="content"></div>
</section>

<div id="pin">
 <h2>Enter Passcode</h2><p style="color:#ccc">Unlock Mavin's iPhone</p>
 <div id="dots">○ ○ ○ ○</div><div id="error"></div>
 <div class="keypad" id="keys"></div>
 <button id="cancel" style="background:none;color:#ddd">Cancel</button>
</div>
<div class="homebar"></div>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let pin='',appName='',playing=false;
let notes=JSON.parse(localStorage.getItem('mavin-notes')||'["Shot list: Gotham rooftops","Buy film for the camera","Daily Bugle deadline: submit photos"]');
let events=JSON.parse(localStorage.getItem('mavin-events')||'[]'),chats={};

function tick(){
 const d=new Date();
 const time=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
 $('#clock').textContent=time;$('#lockclock').textContent=time;
 $('#date').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
 $('#day').textContent=d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase();
 $('#num').textContent=d.getDate();
}
tick();setInterval(tick,15000);

function showPin(){pin='';drawPin();$('#error').textContent='';$('#pin').classList.add('show')}
function drawPin(){$('#dots').textContent=Array.from({length:4},(_,i)=>i<pin.length?'●':'○').join(' ')}
function home(){$('#pin').classList.remove('show');$('#lock').classList.remove('active');$('#app').classList.remove('active');$('#home').classList.add('active')}
function lock(){$('#pin').classList.remove('show');$('#home').classList.remove('active');$('#app').classList.remove('active');$('#lock').classList.add('active')}
$('#unlock').onclick=showPin;$('#cancel').onclick=()=>$('#pin').classList.remove('show');
for(let n=1;n<=9;n++){let b=document.createElement('button');b.textContent=n;b.onclick=()=>addPin(''+n);$('#keys').append(b)}
$('#keys').append(document.createElement('span'));
let zero=document.createElement('button');zero.textContent='0';zero.onclick=()=>addPin('0');$('#keys').append(zero);
let del=document.createElement('button');del.textContent='⌫';del.onclick=()=>{pin=pin.slice(0,-1);drawPin()};$('#keys').append(del);
function addPin(n){if(pin.length>=4)return;pin+=n;drawPin();if(pin.length===4){if(pin==='1711')setTimeout(home,150);else{$('#error').textContent='Incorrect passcode';setTimeout(()=>{pin='';drawPin()},650)}}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openApp(n){appName=n;$('#title').textContent=n;$('#home').classList.remove('active');$('#lock').classList.remove('active');$('#app').classList.add('active');render(n);$('#app').scrollTop=0}
$$('[data-app]').forEach(b=>b.addEventListener('click',e=>{if(e.target.closest('[data-control]'))return;openApp(b.dataset.app)}));
$('#back').onclick=home;$('#lockBtn').onclick=lock;
$$('[data-control]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(b.dataset.control==='play'){playing=!playing;b.textContent=playing?'Ⅱ':'▶'}else{b.textContent=b.dataset.control==='prev'?'◀◀':'▶▶'}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#app').classList.contains('active'))home();else $('#pin').classList.remove('show')}});

function render(n){
 const c=$('#content');c.innerHTML='';
 if(n==='Weather'){
 c.innerHTML=`<div class="card" style="text-align:center;background:linear-gradient(140deg,#617d98,#263c51);color:white"><div>Bandung · Current weather</div><div style="font-size:65px;font-weight:250">61°</div>☁ Cloudy<p>H:62° · L:52°</p><p>Feels like 60° · Humidity 68% · Wind 8 km/h</p></div><h3>Hourly forecast</h3><div class="card">2 PM ☁ 61°　3 PM ☁ 62°　4 PM ☁ 61°</div><h3>10-day forecast</h3><p class="notice">Demo weather, not live data.</p>`;
 }
 else if(n==='WhatsApp'){
 const names=['Sal','Kinan','Opi','Daily Bugle Desk','Peter','Aunt May','MJ','Flash'];
 c.innerHTML=`<input class="field" id="search" placeholder="Search chats"><div id="chatlist">${names.map((x,i)=>`<button class="item" data-chat="${x}"><span class="avatar">${['🌻','📚','☕','📰','📷','🏠','🎧','🕸️'][i]}</span><span><b>${x}</b><br><span class="muted">${esc((chats[x]||['Hey, are we still on for today?']).slice(-1)[0])}</span></span><span style="margin-left:auto" class="muted">10:${12+i}</span></button>`).join('')}</div>`;
 $$('[data-chat]').forEach(b=>b.onclick=()=>chat(b.dataset.chat));
 $('#search').oninput=e=>$$('[data-chat]').forEach(b=>b.classList.toggle('hide',!b.dataset.chat.toLowerCase().includes(e.target.value.toLowerCase())));
 }
 else if(n==='Calendar'){
 let d=new Date(),m=new Date(d.getFullYear(),d.getMonth(),1);
 c.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><button class="primary" id="prev">‹</button><h2 id="month"></h2><button class="primary" id="next">›</button></div><div class="card"><div id="calgrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center"></div></div><h3>Events</h3><div id="events"></div><input id="eventname" class="field" placeholder="Event title"><input id="eventdate" class="field" type="date" value="${d.toISOString().slice(0,10)}"><button class="primary" id="addevent">Add event</button>`;
 function drawEvents(){$('#events').innerHTML=events.map((e,i)=>`<div class="item">${esc(e.date)} · ${esc(e.title)} <button data-del="${i}" style="margin-left:auto;color:#d33;background:none">Delete</button></div>`).join('')||'<p class="muted">No events yet.</p>';$$('[data-del]').forEach(b=>b.onclick=()=>{events.splice(+b.dataset.del,1);localStorage.setItem('mavin-events',JSON.stringify(events));drawEvents()})}
 function draw(){ $('#month').textContent=m.toLocaleDateString('en-US',{month:'long',year:'numeric'});let g=$('#calgrid');g.innerHTML=['S','M','T','W','T','F','S'].map(x=>`<b>${x}</b>`).join('');let offset=m.getDay(),count=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();for(let i=0;i<offset;i++)g.innerHTML+='<span></span>';for(let i=1;i<=count;i++)g.innerHTML+=`<button data-date="${i}" style="background:${i===d.getDate()&&m.getMonth()===d.getMonth()?'#087cff':'transparent'};color:${i===d.getDate()&&m.getMonth()===d.getMonth()?'white':'#222'};border-radius:50%;padding:7px 0">${i}</button>`;$$('[data-date]').forEach(b=>b.onclick=()=>$('#eventdate').value=`${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}-${String(+b.dataset.date).padStart(2,'0')}`);drawEvents()}
 $('#prev').onclick=()=>{m.setMonth(m.getMonth()-1);draw()};$('#next').onclick=()=>{m.setMonth(m.getMonth()+1);draw()};
 $('#addevent').onclick=()=>{if(!$('#eventname').value.trim())return;events.push({title:$('#eventname').value.trim(),date:$('#eventdate').value});localStorage.setItem('mavin-events',JSON.stringify(events));$('#eventname').value='';drawEvents()};draw();
 }
 else if(n==='Instagram'){
 let pics=['📷','🌆','☕','🌧️','🏙️','🌿','🚇','🌅','📚','🌃','🎞️'];
 c.innerHTML=`<div class="card"><h2>mavin</h2><p>collecting moments, not things</p><b>11</b> posts　<b>483</b> followers　<b>291</b> following</div><div class="photo-grid">${pics.map((x,i)=>`<button data-photo="${i}">${x}</button>`).join('')}</div><h3>For you</h3>${['gotham.daily','peterp','m.jane'].map((x,i)=>`<div class="card"><b>${x}</b><p style="font-size:50px;text-align:center">${['🌇','🕷️','🎧'][i]}</p><button data-like style="background:none">♡ Like</button></div>`).join('')}`;
 $$('[data-photo]').forEach(b=>b.onclick=()=>photo('Mavin photo '+(+b.dataset.photo+1),b.textContent));
 $$('[data-like]').forEach(b=>b.onclick=()=>b.textContent=b.textContent.includes('♡')?'♥ Liked':'♡ Like');
 }
 else if(n==='X'){
 c.innerHTML=`<div class="card"><h2>@mavin 🔒</h2><p>private account · camera in hand, deadlines in mind</p>87 Following　42 Followers</div>${['gotham.news: Gotham looks suspiciously peaceful today.','mavin: the light was good for approximately 14 seconds and i was READY','peterp: anyone seen my backpack?','mavin: daily bugle wants the photos yesterday.'].map(x=>`<div class="card"><b>${esc(x.split(':')[0])}</b><p>${esc(x.split(':').slice(1).join(':'))}</p><button data-like style="background:none">♡ Like</button>　<button data-reply style="background:none">Reply</button><p class="muted"></p></div>`).join('')}`;
 $$('[data-like]').forEach(b=>b.onclick=()=>b.textContent=b.textContent.includes('♡')?'♥ Liked':'♡ Like');
 $$('[data-reply]').forEach(b=>b.onclick=()=>{let v=prompt('Write a reply');if(v)b.nextElementSibling.nextElementSibling.textContent='Reply saved: '+v});
 }
 else if(n==='Spotify'||n==='Music'){

 else if(n==='Photos'){

 function edit(i){c.innerHTML=`<button id="noteback" style="background:none;color:#087cff">‹ Notes</button><textarea id="notetext" class="field" rows="12">${esc(i<0?'':notes[i])}</textarea><button class="primary" id="savenote">Save</button> ${i>=0?'<button id="deletenote" style="background:none;color:#d33">Delete</button>':''}`;$('#noteback').onclick=list;$('#savenote').onclick=()=>{if(i>=0)notes[i]=$('#notetext').value;else notes.unshift($('#notetext').value||'Untitled note');localStorage.setItem('mavin-notes',JSON.stringify(notes));list()};if(i>=0)$('#deletenote').onclick=()=>{notes.splice(i,1);localStorage.setItem('mavin-notes',JSON.stringify(notes));list()}}
 list();

 else if(n==='YouTube'){
 c.innerHTML=`<h2>YouTube</h2><input id="ytsearch" class="field" placeholder="Search YouTube"><div class="card"><h3>aespa 에스파</h3><p>Official channel</p><button class="primary" id="channel">Open official aespa channel ↗</button></div>${['aespa Official Videos','aespa Drama','aespa Supernova'].map((x,i)=>`<button class="item" data-video="${i}">▶　${x}</button>`).join('')}<p class="notice">Videos open on YouTube.</p>`;

 $$('[data-video]').forEach(b=>b.onclick=()=>window.open('https://www.youtube.com/results?search_query='+encodeURIComponent('aespa '+b.textContent),'_blank','noopener'));
 $('#ytsearch').onkeydown=e=>{if(e.key==='Enter')window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(e.target.value),'_blank','noopener')};

 else if(n==='Camera'){

 $('#capture').onclick=()=>{let v=$('#video'),cv=$('#canvas');if(!v.videoWidth){$('#cammsg').textContent='Start camera first.';return}cv.width=v.videoWidth;cv.height=v.videoHeight;cv.getContext('2d').drawImage(v,0,0);let u=cv.toDataURL('image/png');$('#result').innerHTML=`<p>Captured photo</p><img src="${u}" style="width:100%"><br><a download="mavin-photo.png" href="${u}">Save photo</a>`};
 }
 else if(n==='Calculator'){
 c.innerHTML=`<div class="card" style="background:#111;color:white"><input id="display" value="0" readonly style="width:100%;font-size:42px;background:none;color:white;border:0;text-align:right;margin:20px 0"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(x=>`<button data-calc="${x}" style="aspect-ratio:1;border-radius:50%;font-size:21px;background:${['÷','×','−','+','='].includes(x)?'#f5a623':['AC','±','%','⌫'].includes(x)?'#aaa':'#444'};color:${['AC','±','%','⌫'].includes(x)?'#111':'white'}">${x}</button>`).join('')}</div></div>`;
 let expr='',fresh=true;
 $$('[data-calc]').forEach(b=>b.onclick=()=>{let x=b.dataset.calc,d=$('#display');
 if(x==='AC'){expr='';d.value='0';fresh=true;return}
 if(x==='⌫'){expr=expr.slice(0,-1);d.value=expr||'0';return}
 if(x==='±'){expr=expr.startsWith('-')?expr.slice(1):'-'+expr;d.value=expr;return}
 if(x==='='){try{let q=expr.replace(/[×÷−]/g,m=>({'×':'*','÷':'/','−':'-'}[m]));if(!/^[0-9+*/.() -]+$/.test(q))throw 0;let v=Function('return ('+q+')')();if(!Number.isFinite(v))throw 0;expr=String(v);d.value=expr;fresh=true}catch{d.value='Error';expr='';fresh=true}return}
 if(x==='%'){expr=String(Number(expr)/100);d.value=expr;return}
 if(['+','−','×','÷'].includes(x)){expr+=x;fresh=false}else{if(fresh){expr='';fresh=false}expr+=x}d.value=expr||'0'});
 }
 else if(n==='Gmail'){

 $('#sendmail').onclick=()=>alert('Demo only. No email sent.');
 }
 else if(n==='Settings'){
 c.innerHTML=`<div class="card"><h2>👤 Mavin</h2><p class="muted">Apple Account, iCloud and more</p></div>${['Airplane Mode','Wi-Fi','Bluetooth','Notifications','Display & Brightness','Wallpaper','Sounds & Haptics','Privacy & Security','iCloud · mavin@icloud.example','Lock Screen'].map((x,i)=>`<button class="item" data-setting="${x}">${['✈️','📶','ᛒ','🔔','☀️','🖼️','🔊','🔒','☁️','🔐'][i]}　${x}　›</button>`).join('')}<p class="notice">Fictional settings. No real Apple Account connected.</p>`;
 $$('[data-setting]').forEach(b=>b.onclick=()=>{if(b.dataset.setting==='Lock Screen'){lock();return}let s=b.dataset.setting;c.innerHTML=`<button id="setback" style="background:none;color:#087cff">‹ Settings</button><h2>${esc(s)}</h2><div class="card">${s.includes('iCloud')?'Mavin’s fictional iCloud profile.':esc(s)+' settings'}</div><label><input type="checkbox" checked> Enable ${esc(s)}</label>`;$('#setback').onclick=()=>render('Settings')});
 }
}

function chat(n){
 let c=$('#content'),msgs=chats[n]||['Hey, are we still on for today?'];chats[n]=msgs;
 c.innerHTML=`<button id="chatback" style="background:none;color:#087cff">‹ Chats</button><h2>${esc(n)}</h2><div id="bubbles">${msgs.map((m,i)=>`<div class="bubble ${i%2?'me':''}">${esc(m)}</div>`).join('')}</div><form id="send" style="display:flex;gap:7px;position:sticky;bottom:0;background:#f4f4f7;padding:8px"><input id="message" class="field" style="margin:0;border-radius:20px" placeholder="Message"><button class="primary">➤</button></form>`;
 $('#chatback').onclick=()=>render('WhatsApp');
 $('#send').onsubmit=e=>{e.preventDefault();let t=$('#message').value.trim();if(t){chats[n].push(t);chat(n)}};
