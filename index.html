
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Mavin's iPhone</title>

<style>
*{box-sizing:border-box}
:root{--blue:#087cff;--paper:#f4f4f7}
body{margin:0;background:#111;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0;color:inherit}
#phone{height:100dvh;width:100%;max-width:430px;margin:auto;position:relative;overflow:hidden;background:#222}
#wall{position:absolute;inset:0;background:url('https://raw.githubusercontent.com/runweebss/Interactive-Winrina-AU/main/camera-wallpaper.jpg') center/cover}
#wall:after{content:"";position:absolute;inset:0;background:#0001}
.status{position:absolute;z-index:6;top:9px;left:7%;right:7%;display:flex;justify-content:space-between;font-weight:700;text-shadow:0 1px 5px #000;pointer-events:none}
.screen{position:absolute;inset:0;display:none;z-index:2}
.screen.active{display:block}
.lock{z-index:5;background:#000}
.lock img{width:100%;height:100%;object-fit:cover;position:absolute}
.lockdate{position:absolute;top:7%;width:100%;text-align:center;text-shadow:0 2px 8px #000}
.locktime{position:absolute;top:10%;width:100%;text-align:center;font-size:70px;font-weight:250;text-shadow:0 2px 8px #000}
.hint{position:absolute;bottom:7%;width:100%;background:none;color:#f6d9a5;text-shadow:0 1px 5px #000;padding:15px}
.home{padding:52px 5% 118px;overflow-y:auto;scrollbar-width:none}
.home::-webkit-scrollbar{display:none}

/* WEATHER WIDGET */
.weather{
 position:relative;display:block;width:100%;height:174px;padding:0;
 border:0;border-radius:28px;overflow:hidden;color:#fff;text-align:left;
 background:linear-gradient(145deg,rgba(91,111,127,.96),rgba(37,56,72,.97));
 box-shadow:0 8px 24px rgba(0,0,0,.12)
}
.city{position:absolute;top:16px;left:18px;font-size:18px;line-height:24px;font-weight:600}
.temp{position:absolute;top:43px;left:17px;font-size:55px;line-height:1.1;font-weight:250;letter-spacing:-2px}
.desc{position:absolute;top:17px;right:17px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:14px;line-height:19px;white-space:nowrap}
.desc .weather-icon{font-size:24px;line-height:28px;margin-bottom:1px}
.hours{position:absolute;left:12px;right:12px;bottom:10px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:end;gap:0;text-align:center;font-size:10px;line-height:14px}
.hours div{min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.hours b{display:block;font-size:19px;line-height:23px;font-weight:400;margin:0}
.wlabel{text-align:center;margin:7px 0 18px;text-shadow:0 1px 5px #000}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 7px}
.app{display:flex;align-items:center;flex-direction:column;gap:6px;background:none;text-shadow:0 1px 4px #000;min-width:0;padding:0}
.ico{width:min(100%,66px);aspect-ratio:1;border-radius:18px;display:grid;place-items:center;font-size:32px;font-weight:650;box-shadow:0 3px 7px #0003}
.app label{font-size:12px;white-space:nowrap}
.wa{background:#21ce69}
.calendar{background:white;color:#111;display:flex;flex-direction:column;justify-content:center;line-height:1}
.calendar small{font-size:11px;color:#d22}
.ig{background:radial-gradient(circle at 30% 100%,#ffd66d,#f34c5e 48%,#8238ce)}
.x{background:#000}
.spotify{background:#111;color:#1ed760}
.photos{background:#fff;color:#ef7359}
.notes{background:linear-gradient(#ffcf4b 20%,white 20%);color:#999}
.yt{background:white;color:#e00}

.music{position:relative;width:100%;min-height:0;margin-top:20px;padding:14px;border-radius:24px;background:#252527ed;text-align:left;backdrop-filter:blur(18px);box-shadow:0 8px 20px #0004;display:block}
.album{width:68px;height:68px;border-radius:10px;background:linear-gradient(135deg,#bbb,#333);display:grid;place-items:center;font-size:28px;margin-bottom:9px}
.song{font-size:15px;font-weight:650}
.artist{font-size:13px;color:#ccc;margin-top:3px}
.bar{height:4px;background:#777;margin:14px 0 5px;border-radius:4px}
.bar i{display:block;width:46%;height:100%;background:white}
.track{display:flex;justify-content:space-between;font-size:10px}
.controls{display:flex;justify-content:space-between;margin-top:10px}
.controls button{background:none;font-size:18px;padding:4px 8px}
.pages{position:relative;width:100%;text-align:center;letter-spacing:7px;margin:20px 0 18px;text-shadow:0 1px 5px #000}
.dock{position:absolute;bottom:16px;left:5%;right:5%;height:78px;border-radius:28px;background:#cbbca5d9;backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:8px;z-index:3}
.dock .ico{width:57px;border-radius:15px}

.appscreen{background:var(--paper);color:#171719;overflow-y:auto;padding-bottom:35px;z-index:4;scrollbar-width:none}
.topbar{position:sticky;top:0;background:#f8f8f9ed;backdrop-filter:blur(14px);padding:13px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ddd;z-index:2}
.topbar button{background:none;color:var(--blue)}
.topbar strong{font-size:18px}
.content{padding:16px}
.card{background:white;color:#222;border-radius:15px;padding:15px;margin-bottom:12px}
.muted{color:#777}
.field{width:100%;padding:13px;border:1px solid #ccc;border-radius:12px;background:white;color:#111;margin:5px 0 10px;outline-color:var(--blue)}
.primary{background:var(--blue);color:white;border-radius:11px;padding:11px 14px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid #ddd;background:transparent;color:#222}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ddd;flex-shrink:0;font-size:22px}
.bubble{padding:10px 13px;border-radius:16px;background:#e4e4e9;color:#111;margin:8px 0;max-width:85%;overflow-wrap:anywhere}
.bubble.me{margin-left:auto;background:#a2e6a0}
.pinpanel{position:absolute;inset:0;background:#080808f2;z-index:8;display:none;text-align:center;padding-top:18%}
.pinpanel.show{display:block}
.pinpanel h2{font-weight:400}
.dots{letter-spacing:10px;font-size:23px;min-height:30px}
.error{height:20px;color:#ff9999;font-size:13px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;margin:20px auto}
.keypad button{aspect-ratio:1;border-radius:50%;background:#ffffff20;border:1px solid #ffffff35;font-size:24px}
.homebar{position:absolute;bottom:5px;left:calc(50% - 50px);width:100px;height:4px;border-radius:5px;background:#ffffffb5;z-index:10}
.hide{display:none!important}
.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.photoGrid button{aspect-ratio:1;background:linear-gradient(140deg,#d4b69a,#526270);font-size:30px}
.notice{font-size:12px;color:#777}
video{object-fit:cover}
@media(max-width:360px){
 .weather{height:164px}
 .temp{font-size:49px}
 .desc{right:13px;font-size:12px}
 .hours{left:7px;right:7px;font-size:9px}
 .grid{gap:20px 5px}
 .ico{border-radius:15px}
 .app label{font-size:11px}
 .home{padding-left:4%;padding-right:4%}
}
@media(min-width:600px){
 #phone{height:min(900px,100dvh);border:5px solid #222;border-radius:32px}
 .home{padding-left:25px;padding-right:25px}
}
</style>
</head>

<body>
<div id="phone">
<div id="wall"></div>

<div class="status">
 <span id="clock">11:11</span>
 <span>▮▮▮ ◉ ▰</span>
</div>

<section class="screen lock active" id="lock">
 <img src="alohomora-lockscreen.jpg" alt="Alohomora lock screen">
 <div class="lockdate" id="date"></div>
 <div class="locktime" id="lockclock">11:11</div>
 <button class="hint" id="unlock">↑ &nbsp; swipe up to unlock</button>
</section>

<section class="screen home" id="home">
 <button class="weather" data-app="Weather">
  <div class="city">Bandung</div>
  <div class="temp">61°</div>
  <div class="desc">
   <span class="weather-icon">☁</span>
   <span>Cloudy</span>
   <span>H:62° L:52°</span>
  </div>
  <div class="hours">
   <div><span>2PM</span><b>☁</b><span>61°</span></div>
   <div><span>3PM</span><b>☁</b><span>62°</span></div>
   <div><span>4PM</span><b>☁</b><span>61°</span></div>
   <div><span>5PM</span><b>☁</b><span>62°</span></div>
   <div><span>6PM</span><b>☁</b><span>62°</span></div>
   <div><span>7PM</span><b>☁</b><span>61°</span></div>
  </div>
 </button>
 <div class="wlabel">Weather</div>

 <div class="grid">
  <button class="app" data-app="WhatsApp"><span class="ico wa">☎</span><label>WhatsApp</label></button>
  <button class="app" data-app="Calendar"><span class="ico calendar"><small id="day">THU</small><span id="num">29</span></span><label>Calendar</label></button>
  <button class="app" data-app="Instagram"><span class="ico ig">◎</span><label>Instagram</label></button>
  <button class="app" data-app="X"><span class="ico x">𝕏</span><label>X</label></button>
  <button class="app" data-app="Spotify"><span class="ico spotify">●</span><label>Spotify</label></button>
  <button class="app" data-app="Photos"><span class="ico photos">✿</span><label>Photos</label></button>
  <button class="app" data-app="Notes"><span class="ico notes">▤</span><label>Notes</label></button>
  <button class="app" data-app="YouTube"><span class="ico yt">▶</span><label>YouTube</label></button>
 </div>

 <button class="music" data-app="Music">
  <div class="album">♫</div>
  <div class="song">everything u are</div>
  <div class="artist">Hindia</div>
  <div class="bar"><i id="progress"></i></div>
  <div class="track"><span>1:53</span><span>−2:04</span></div>
  <div class="controls">
   <button data-control="prev">◀◀</button>
   <button data-control="play">▶</button>
   <button data-control="next">▶▶</button>
  </div>
 </button>

 <div class="pages">● ○ ○</div>

 <div class="dock">
  <button class="app" data-app="Camera"><span class="ico" style="background:#ddd;color:#222">📷</span></button>
  <button class="app" data-app="Calculator"><span class="ico" style="background:#ddd;color:#222">🧮</span></button>
  <button class="app" data-app="Gmail"><span class="ico" style="background:#fff;color:#d44">✉</span></button>
  <button class="app" data-app="Settings"><span class="ico" style="background:#ddd;color:#222">⚙</span></button>
 </div>
</section>

<section class="screen appscreen" id="app">
 <div class="topbar">
  <button id="back">‹ Home</button>
  <strong id="title">App</strong>
  <span style="flex:1"></span>
  <button id="lockBtn">Lock</button>
 </div>
 <div class="content" id="content"></div>
</section>

<div class="pinpanel" id="pin">
 <h2>Enter Passcode</h2>
 <p style="color:#ccc">Unlock Mavin's iPhone</p>
 <div class="dots" id="dots">○ ○ ○ ○</div>
 <div class="error" id="error"></div>
 <div class="keypad" id="keys"></div>
 <button id="cancel" style="background:none;color:#ddd">Cancel</button>
</div>

<div class="homebar" id="homebar"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
let pin='',appName='',playing=false;
let notes=JSON.parse(localStorage.getItem('mavin-notes')||'["Shot list: Gotham rooftops","Buy film for the camera","Daily Bugle deadline: submit photos"]');
let events=JSON.parse(localStorage.getItem('mavin-events')||'[]');
let chats={};

function tick(){
 const d=new Date();
 const time=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
 $('#clock').textContent=time;
 $('#lockclock').textContent=time;
 $('#date').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
 $('#day').textContent=d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase();
 $('#num').textContent=d.getDate();
}
tick();
setInterval(tick,15000);

function showPin(){
 pin='';
 drawPin();
 $('#error').textContent='';
 $('#pin').classList.add('show');
}
function drawPin(){
 $('#dots').textContent=Array.from({length:4},(_,i)=>i<pin.length?'●':'○').join(' ');
}
function home(){
 $('#pin').classList.remove('show');
 $('#lock').classList.remove('active');
 $('#app').classList.remove('active');
 $('#home').classList.add('active');
}
function lock(){
 $('#pin').classList.remove('show');
 $('#home').classList.remove('active');
 $('#app').classList.remove('active');
 $('#lock').classList.add('active');
}
$('#unlock').onclick=showPin;
$('#cancel').onclick=()=>$('#pin').classList.remove('show');
for(let n=1;n<=9;n++){
 let b=document.createElement('button');
 b.textContent=n;
 b.onclick=()=>addPin(''+n);
 $('#keys').append(b);
}
$('#keys').append(document.createElement('span'));
let zero=document.createElement('button');
zero.textContent='0';
zero.onclick=()=>addPin('0');
$('#keys').append(zero);
let del=document.createElement('button');
del.textContent='⌫';
del.onclick=()=>{pin=pin.slice(0,-1);drawPin()};
$('#keys').append(del);

function addPin(n){
 if(pin.length>=4)return;
 pin+=n;
 drawPin();
 if(pin.length===4){
  if(pin==='1711')setTimeout(home,160);
  else{
   $('#error').textContent='Incorrect passcode';
   setTimeout(()=>{pin='';drawPin()},650);
  }
 }
}

$$('[data-app]').forEach(b=>{
 b.onclick=e=>{
  if(e.target.closest('[data-control]'))return;
  openApp(b.dataset.app);
 };
});
$('#back').onclick=home;
$('#lockBtn').onclick=lock;
$('#homebar').onclick=()=>{
 if($('#app').classList.contains('active'))home();
 else if($('#lock').classList.contains('active'))showPin();
 else home();
};

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function openApp(n){
 appName=n;
 $('#title').textContent=n;
 $('#home').classList.remove('active');
 $('#app').classList.add('active');
 render(n);
}

function render(n){
 let c=$('#content');
 c.innerHTML='';

 if(n==='Weather'){
  c.innerHTML=`
   <div class="card" style="text-align:center;background:linear-gradient(140deg,#617d98,#263c51);color:white">
    <div>Bandung · Current weather</div>
    <div style="font-size:65px;font-weight:250">61°</div>
    ☁ Cloudy
    <p>H: 62° · L: 52°</p>
    <p>Feels like 60° · Humidity 68% · Wind 8 km/h</p>
   </div>
   <h3>Hourly forecast</h3>
   <div class="card">2 PM ☁ 61°　3 PM ☁ 62°　4 PM ☁ 61°　5 PM ☁ 62°</div>
   <h3>10-day forecast</h3>
   ${['Today · Cloudy · 62° / 52°','Friday · Partly cloudy · 63° / 51°','Saturday · Light rain · 60° / 50°'].map(x=>`<div class="item">${x}</div>`).join('')}
   <p class="notice">Demo weather, not live data.</p>`;
 }

 else if(n==='WhatsApp'){
  let names=['Sal','Kinan','Opi','Daily Bugle Desk','Peter','Aunt May','MJ','Flash'];
  c.innerHTML=`
   <input class="field" id="search" placeholder="Search chats">
   <div id="chatlist">
   ${names.map((x,i)=>`<button class="item" data-chat="${x}">
    <span class="avatar">${['🌻','📚','☕','📰','📷','🏠','🎧','🕸️'][i]}</span>
    <span><b>${x}</b><br><span class="muted">${esc((chats[x]||['Hey, are we still on for today?']).slice(-1)[0])}</span></span>
    <span style="margin-left:auto" class="muted">10:${12+i}</span>
   </button>`).join('')}
   </div>`;
  $$('[data-chat]').forEach(b=>b.onclick=()=>chat(b.dataset.chat));
  $('#search').oninput=e=>$$('[data-chat]').forEach(b=>b.classList.toggle('hide',!b.dataset.chat.toLowerCase().includes(e.target.value.toLowerCase())));
 }

 else if(n==='Calendar'){
  let d=new Date(),m=new Date(d.getFullYear(),d.getMonth(),1);
  c.innerHTML=`
   <div style="display:flex;justify-content:space-between;align-items:center">
    <button class="primary" id="prev">‹</button><h2 id="month"></h2><button class="primary" id="next">›</button>
   </div>
   <div class="card"><div id="calgrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center"></div></div>
   <h3>Events</h3><div id="events"></div>
   <input id="eventname" class="field" placeholder="Event title">
   <input id="eventdate" class="field" type="date" value="${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}">
   <button class="primary" id="addevent">Add event</button>`;

  function draw(){
   $('#month').textContent=m.toLocaleDateString('en-US',{month:'long',year:'numeric'});
   let g=$('#calgrid');
   g.innerHTML=['S','M','T','W','T','F','S'].map(x=>`<b>${x}</b>`).join('');
   let offset=m.getDay(),count=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
   for(let i=0;i<offset;i++)g.innerHTML+='<span></span>';
   for(let i=1;i<=count;i++){
    let selected=i===d.getDate()&&m.getMonth()===d.getMonth()&&m.getFullYear()===d.getFullYear();
    g.innerHTML+=`<button data-date="${i}" style="background:${selected?'#087cff':'transparent'};color:${selected?'white':'#222'};border-radius:50%;padding:7px 0">${i}</button>`;
   }
   $$('[data-date]').forEach(b=>b.onclick=()=>{
    $('#eventdate').value=`${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}-${String(+b.dataset.date).padStart(2,'0')}`;
   });
   drawEvents();
  }
  function drawEvents(){
   $('#events').innerHTML=events.map((e,i)=>`<div class="item">${esc(e.date)} · ${esc(e.title)} <button data-del="${i}" style="margin-left:auto;color:#d33">Delete</button></div>`).join('')||'<p class="muted">No events yet.</p>';
   $$('[data-del]').forEach(b=>b.onclick=()=>{
    events.splice(+b.dataset.del,1);
    localStorage.setItem('mavin-events',JSON.stringify(events));
    drawEvents();
   });
  }
  $('#prev').onclick=()=>{m.setMonth(m.getMonth()-1);draw()};
  $('#next').onclick=()=>{m.setMonth(m.getMonth()+1);draw()};
  $('#addevent').onclick=()=>{
   if(!$('#eventname').value.trim())return;
   events.push({title:$('#eventname').value.trim(),date:$('#eventdate').value});
   localStorage.setItem('mavin-events',JSON.stringify(events));
   $('#eventname').value='';
   drawEvents();
  };
  draw();
 }

 else if(n==='Instagram'){
  let pics=['📷','🌆','☕','🌧️','🏙️','🌿','🚇','🌅','📚','🌃','🎞️'];
  c.innerHTML=`
   <div class="card"><h2>mavin</h2><p>collecting moments, not things</p><b>11</b> posts　<b>483</b> followers　<b>291</b> following</div>
   <div class="photoGrid">${pics.map((x,i)=>`<button data-photo="${i}">${x}</button>`).join('')}</div>
   <h3>For you</h3>
   ${['gotham.daily','peterp','m.jane'].map((x,i)=>`<div class="card"><b>${x}</b><p style="font-size:50px;text-align:center">${['🌇','🕷️','🎧'][i]}</p><button data-like>♡ Like</button>　Comment</div>`).join('')}`;
  $$('[data-photo]').forEach(b=>b.onclick=()=>photo('Mavin photo '+(+b.dataset.photo+1),b.textContent));
  $$('[data-like]').forEach(b=>b.onclick=()=>b.textContent=b.textContent.includes('♡')?'♥ Liked':'♡ Like');
 }

 else if(n==='X'){
  c.innerHTML=`
   <div class="card"><h2>@mavin 🔒</h2><p>private account · camera in hand, deadlines in mind</p>87 Following　42 Followers</div>
   ${['gotham.news: Gotham looks suspiciously peaceful today.','mavin: the light was good for approximately 14 seconds and i was READY','peterp: anyone seen my backpack?','mavin: daily bugle wants the photos yesterday.'].map(x=>`<div class="card"><b>${esc(x.split(':')[0])}</b><p>${esc(x.split(':').slice(1).join(':'))}</p><button data-like>♡ Like</button>　<button data-reply>Reply</button><p class="muted"></p></div>`).join('')}`;
  $$('[data-like]').forEach(b=>b.onclick=()=>b.textContent=b.textContent.includes('♡')?'♥ Liked':'♡ Like');
  $$('[data-reply]').forEach(b=>b.onclick=()=>{
   let v=prompt('Write a reply');
   if(v)b.nextElementSibling.nextElementSibling.textContent='Reply saved: '+v;
  });
 }

 else if(n==='Spotify'||n==='Music'){
  c.innerHTML=`
   <div class="card" style="text-align:center;background:#173d2b;color:white">
    <div class="album" style="width:190px;height:190px;margin:0 auto 12px;font-size:55px">🎵</div>
    <h2>everything u are</h2><p>Hindia</p>
    <input id="range" type="range" min="0" max="244" value="113" style="width:100%">
    <div><span id="elapsed">1:53</span> / 4:04</div>
    <p><button id="prevSong">◀◀</button>　<button id="play">▶</button>　<button id="nextSong">▶▶</button></p>
    <small id="state">Interactive demo player, audio not connected</small>
   </div>
   <h3>Your playlists</h3>
   ${['Liked Songs','Menari dengan Bayangan','Indie Indonesia','Late night thoughts','Giselle mix'].map(x=>`<button class="item" data-list="${x}">🎧　${x}　›</button>`).join('')}
   <p class="notice">Player controls work as a demo. No copyrighted audio is bundled.</p>`;

 else if(n==='Camera'){

    <button id="capture" class="primary">Capture</button>
    <canvas id="canvas" class="hide"></canvas>
    <div id="result"></div>
   </div>`;
  $('#startcam').onclick=async()=>{
   try{
    let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    $('#video').srcObject=stream;
    $('#cammsg').textContent='Camera active.';
   }catch(e){
    $('#cammsg').textContent='Camera unavailable or permission denied. Use HTTPS and allow camera access.';
   }
  };
  $('#capture').onclick=()=>{
   let v=$('#video'),cv=$('#canvas');
   if(!v.videoWidth){$('#cammsg').textContent='Start camera first.';return}
   cv.width=v.videoWidth;cv.height=v.videoHeight;
   cv.getContext('2d').drawImage(v,0,0);
   let u=cv.toDataURL('image/png');
   $('#result').innerHTML=`<p>Captured photo</p><img src="${u}" style="width:100%"><a download="mavin-photo.png" href="${u}">Save photo</a>`;
  };
 }

 else if(n==='Calculator'){
  c.innerHTML=`
   <div class="card" style="background:#111;color:white">
    <input id="display" value="0" readonly style="width:100%;font-size:45px;background:none;color:white;border:0;text-align:right;margin:20px 0">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
     ${['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(x=>`<button data-calc="${x}" style="aspect-ratio:1;border-radius:50%;font-size:21px;background:${['÷','×','−','+','='].includes(x)?'#f5a623':['AC','±','%','⌫'].includes(x)?'#aaa':'#444'};color:${['AC','±','%','⌫'].includes(x)?'#111':'white'}">${x}</button>`).join('')}
    </div>
   </div>`;
  let expr='',fresh=true;
  $$('[data-calc]').forEach(b=>b.onclick=()=>{
   let x=b.dataset.calc,d=$('#display');
   if(x==='AC'){expr='';d.value='0';fresh=true;return}
   if(x==='⌫'){expr=expr.slice(0,-1);d.value=expr||'0';return}
   if(x==='±'){expr=expr.startsWith('-')?expr.slice(1):'-'+expr;d.value=expr;return}
   if(x==='%'){
    try{
     let q=expr.replace(/[×÷−]/g,m=>({'×':'*','÷':'/','−':'-'}[m]));
     expr=String(Function('"use strict";return ('+q+')')()/100);
     d.value=expr;
    }catch{}
    return;
   }
   if(x==='='){
    try{
     let q=expr.replace(/[×÷−]/g,m=>({'×':'*','÷':'/','−':'-'}[m]));
     if(!/^[0-9+*/.() -]+$/.test(q))throw Error();
     expr=String(Function('"use strict";return ('+q+')')());
     d.value=expr;fresh=true;
    }catch{d.value='Error';expr=''}
    return;
   }
   if(['+','−','×','÷'].includes(x)){expr+=x;fresh=false}
   else{if(fresh){expr='';fresh=false}expr+=x}
   d.value=expr||'0';
  });
 }

function chat(n){

  <form id="send" style="display:flex;gap:7px;position:sticky;bottom:0;background:#f4f4f7;padding:8px">
   <input id="message" class="field" style="margin:0;border-radius:20px" placeholder="Message">
   <button class="primary">➤</button>
  </form>`;
 $('#chatback').onclick=()=>render('WhatsApp');
 $('#send').onsubmit=e=>{
  e.preventDefault();
  let t=$('#message').value.trim();
  if(t){chats[n].push(t);chat(n)}
 };
}
