<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Mavin's iPhone</title>
<style>
:root{--ink:#171719;--paper:#f4f4f7;--blue:#087cff;--gold:#f4d39a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
#phone{position:relative;width:100%;height:100dvh;max-width:430px;margin:auto;overflow:hidden;background:#111;isolation:isolate}
#wall{position:absolute;inset:0;background:url('https://raw.githubusercontent.com/runweebss/Interactive-Winrina-AU/main/camera-wallpaper.jpg') center/cover no-repeat;z-index:0}
#wall:after{content:"";position:absolute;inset:0;background:#00000012;pointer-events:none}
.status{position:absolute;z-index:20;top:0;left:0;right:0;height:38px;padding:8px 7% 0;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;text-shadow:0 1px 4px #000;color:white;pointer-events:none}
.status-right{letter-spacing:2px}
.screen{position:absolute;inset:0;display:none;z-index:2}
.screen.active{display:block}
.lock{z-index:10;background:#000}
.lock img{position:absolute;width:100%;height:100%;inset:0;object-fit:cover}
.lockdate{position:absolute;top:17%;left:0;right:0;text-align:center;font-size:16px;text-shadow:0 2px 8px #000}
.locktime{position:absolute;top:20.5%;left:0;right:0;text-align:center;font-size:clamp(66px,18vw,88px);font-weight:200;letter-spacing:-3px;line-height:1.1;text-shadow:0 2px 8px #000}
.hint{position:absolute;bottom:8.5%;width:100%;padding:15px;background:transparent;color:var(--gold);font-size:16px;text-shadow:0 2px 6px #000}
.home{padding:52px 5% 124px;overflow:hidden}
.weather{position:relative;display:block;width:100%;height:174px;padding:15px 16px;border-radius:29px;background:linear-gradient(145deg,rgba(83,104,123,.94),rgba(29,48,65,.94));color:white;text-align:left;box-shadow:0 8px 24px #0002}
.city{font-size:18px;font-weight:600}
.temp{font-size:56px;font-weight:250;letter-spacing:-2px;line-height:1.05;margin-top:4px}
.desc{position:absolute;right:15px;top:61px;text-align:right;font-size:14px;line-height:1.35}
.hours{position:absolute;left:13px;right:13px;bottom:11px;display:flex;justify-content:space-between;gap:3px;text-align:center;font-size:10px}
.hours div{flex:1;min-width:0}
.hours b{display:block;font-size:18px;font-weight:400;margin:4px 0}
.wlabel{text-align:center;font-size:13px;margin:6px 0 12px;text-shadow:0 1px 4px #000}
.app-layout{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,auto);column-gap:7px;row-gap:17px;align-items:start}
.app{min-width:0;display:flex;align-items:center;flex-direction:column;gap:5px;background:transparent;color:white;padding:0;text-shadow:0 1px 4px #000}
.ico{width:min(100%,65px);aspect-ratio:1;border-radius:17px;display:grid;place-items:center;font-size:31px;font-weight:650;box-shadow:0 4px 9px #0002;overflow:hidden}
.app label{font-size:11px;line-height:1.2;white-space:nowrap}
.wa{background:#20ce68}
.calendar{background:#fff;color:#111;display:flex;flex-direction:column;justify-content:center;line-height:1}
.calendar small{font-size:10px;color:#d22;font-weight:700}
.calendar span{font-size:31px;font-weight:700;margin-top:2px}
.ig{background:radial-gradient(circle at 28% 105%,#ffd66d 0%,#f34c5e 45%,#8b39c9 85%)}
.xicon{background:#000}
.spotify{background:#111;color:#1ed760}
.photos{background:#fff;color:#ee755e}
.notesico{background:linear-gradient(#ffce4b 19%,#fff 19%);color:#999}
.yt{background:#fff;color:#e00}
.music{grid-column:3/5;grid-row:1/3;align-self:start;position:relative;width:100%;min-height:218px;padding:13px;border-radius:25px;background:rgba(36,36,38,.94);color:#fff;text-align:left;box-shadow:0 8px 24px #0003;backdrop-filter:blur(18px);z-index:3}
.album{width:65px;height:65px;border-radius:10px;background:linear-gradient(135deg,#bbb,#393939);display:grid;place-items:center;font-size:28px;margin-bottom:9px}
.song{font-size:14px;font-weight:700;line-height:1.25}
.artist{font-size:13px;color:#ccc;margin-top:4px}
.bar{height:4px;background:#777;margin:13px 0 5px;border-radius:4px;overflow:hidden}
.bar i{display:block;width:46%;height:100%;background:white}
.track{display:flex;justify-content:space-between;font-size:10px;color:#eee}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:4px}
.controls button{background:transparent;color:#fff;font-size:17px;padding:3px 0}
.musiclabel{grid-column:3/5;grid-row:3;text-align:center;margin-top:-12px;font-size:11px;text-shadow:0 1px 4px #000}
.pages{position:absolute;bottom:99px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:8px;color:#fff;text-shadow:0 1px 4px #000;pointer-events:none}
.dock{position:absolute;z-index:5;bottom:15px;left:5%;right:5%;height:78px;border-radius:28px;background:rgba(207,193,171,.82);backdrop-filter:blur(22px);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:8px 10px;gap:8px}
.dock .app{height:100%;justify-content:center;text-shadow:none}
.dock .ico{width:min(100%,57px);border-radius:15px;font-size:29px}
.homebar{position:absolute;z-index:30;bottom:5px;left:calc(50% - 50px);width:100px;height:4px;border-radius:5px;background:#ffffffb5}
.appscreen{z-index:8;background:var(--paper);color:var(--ink);overflow:auto;padding-bottom:35px}
.topbar{position:sticky;top:0;min-height:51px;background:rgba(249,249,251,.94);backdrop-filter:blur(15px);padding:10px 15px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ddd;z-index:4}
.topbar button{background:none;color:var(--blue);font-size:15px;padding:3px 0}
.topbar strong{font-size:17px}
.content{padding:16px}
.card{background:white;color:#222;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 1px 2px #00006}
.muted{color:#777}
.field{display:block;width:100%;padding:12px 13px;border:1px solid #d0d0d5;border-radius:11px;background:white;color:#111;margin:5px 0 10px;outline:none}
.field:focus{border-color:#70aaff}
.primary{background:var(--blue);color:white;border-radius:11px;padding:11px 14px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid #ddd;background:transparent;color:#222}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e2e2e7;flex-shrink:0;font-size:22px}
.bubble{padding:10px 13px;border-radius:17px;background:#e4e4e9;color:#111;margin:8px 0;max-width:85%;overflow-wrap:anywhere}
.bubble.me{margin-left:auto;background:#a4e8a0}
.pinpanel{position:absolute;inset:0;background:#080808f5;z-index:25;display:none;text-align:center;padding-top:23%;color:#fff}
.pinpanel.show{display:block}
.pinpanel h2{font-weight:400;font-size:24px}
.dots{letter-spacing:10px;font-size:23px;min-height:30px}
.error{height:20px;color:#ff9999;font-size:13px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:270px;margin:20px auto}
.keypad button{aspect-ratio:1;border-radius:50%;background:#ffffff20;border:1px solid #ffffff35;font-size:24px;color:white}
.hide{display:none!important}
.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.photoGrid button{aspect-ratio:1;background:linear-gradient(140deg,#d4b69a,#526270);font-size:30px;border-radius:4px}
.notice{font-size:12px;color:#777}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-grid button{aspect-ratio:1;border-radius:50%;font-size:21px}
.calc-display{width:100%;font-size:43px;background:transparent;color:white;border:0;text-align:right;padding:16px 4px;overflow:hidden}
.settings-row{display:flex;align-items:center;gap:12px;background:#fff;color:#222;padding:12px;border-bottom:1px solid #e5e5e9;width:100%;text-align:left}
.settings-row:first-child{border-radius:12px 12px 0 0}
.settings-row:last-child{border-radius:0 0 12px 12px;border-bottom:0}
.settings-icon{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:white;background:#858b95}
.switch{margin-left:auto;accent-color:#34c759}
.form-row{display:flex;gap:8px;align-items:center}
.form-row .field{min-width:0}
.appscreen video{object-fit:cover}
.lock .status{z-index:21}
@media(min-width:600px){#phone{height:min(900px,100dvh);border:5px solid #222;border-radius:32px}.home{padding-left:23px;padding-right:23px}.ico{width:68px}.app-layout{row-gap:20px}}
@media(max-height:730px){.home{padding-top:45px;padding-bottom:110px}.weather{height:155px}.temp{font-size:49px}.app-layout{row-gap:11px}.music{min-height:198px;padding:11px}.album{width:56px;height:56px}.dock{height:68px;bottom:13px}.pages{bottom:88px}}
</style>
</head>
<body>
<div id="phone">
<div id="wall"></div>
<div class="status"><span id="clock">11:11</span><span class="status-right">▮▮▮ ◉ ▰</span></div>

<section class="screen lock active" id="lock">
<img src="alohomora-lockscreen.jpg" alt="Alohomora lock screen">
<div class="lockdate" id="date"></div>
<div class="locktime" id="lockclock">11:11</div>
<button class="hint" id="unlock">↑ &nbsp; swipe up to unlock</button>
</section>

<section class="screen home" id="home">
<button class="weather" data-app="Weather">
<div class="city">Bandung</div>
<div class="temp">61°</div>
<div class="desc">☁<br>Cloudy<br>H:62° L:52°</div>
<div class="hours">
<div>2PM<b>☁</b>61°</div><div>3PM<b>☁</b>62°</div><div>4PM<b>☁</b>61°</div>
<div>5PM<b>☁</b>62°</div><div>6PM<b>☁</b>62°</div><div>7PM<b>☁</b>61°</div>
</div>
</button>
<div class="wlabel">Weather</div>

<div class="app-layout">
<button class="app" data-app="WhatsApp" style="grid-column:1;grid-row:1"><span class="ico wa">☎</span><label>WhatsApp</label></button>
<button class="app" data-app="Calendar" style="grid-column:2;grid-row:1"><span class="ico calendar"><small id="day">THU</small><span id="num">29</span></span><label>Calendar</label></button>
<button class="app" data-app="Instagram" style="grid-column:1;grid-row:2"><span class="ico ig">◎</span><label>Instagram</label></button>
<button class="app" data-app="X" style="grid-column:2;grid-row:2"><span class="ico xicon">𝕏</span><label>X</label></button>
<button class="app" data-app="Spotify" style="grid-column:1;grid-row:3"><span class="ico spotify">●</span><label>Spotify</label></button>
<button class="app" data-app="Photos" style="grid-column:2;grid-row:3"><span class="ico photos">✿</span><label>Photos</label></button>
<button class="app" data-app="Notes" style="grid-column:3;grid-row:3"><span class="ico notesico">▤</span><label>Notes</label></button>
<button class="app" data-app="YouTube" style="grid-column:4;grid-row:3"><span class="ico yt">▶</span><label>YouTube</label></button>

<div class="music" id="musicWidget">
<div class="album">♫</div>
<div class="song">everything u are</div>
<div class="artist">Hindia</div>
<div class="bar"><i id="progress"></i></div>
<div class="track"><span>1:53</span><span>−2:04</span></div>
<div class="controls">
<button data-control="prev" aria-label="Previous">◀◀</button>
<button data-control="play" aria-label="Play">▶</button>
<button data-control="next" aria-label="Next">▶▶</button>
</div>
</div>
<div class="musiclabel">Music</div>
</div>

<div class="pages">● ○ ○</div>
<div class="dock">
<button class="app" data-app="Camera"><span class="ico" style="background:#e7e7eb;color:#222">📷</span></button>
<button class="app" data-app="Calculator"><span class="ico" style="background:#e7e7eb;color:#222">🧮</span></button>
<button class="app" data-app="Gmail"><span class="ico" style="background:#fff;color:#d44">✉</span></button>
<button class="app" data-app="Settings"><span class="ico" style="background:#e7e7eb;color:#222">⚙</span></button>
</div>
</section>

<section class="screen appscreen" id="app">
<div class="topbar"><button id="back">‹ Home</button><strong id="title">App</strong><span style="flex:1"></span><button id="lockBtn">Lock</button></div>
<div class="content" id="content"></div>
</section>

<div class="pinpanel" id="pin">
<h2>Enter Passcode</h2><p style="color:#ccc">Unlock Mavin's iPhone</p>
<div class="dots" id="dots">○ ○ ○ ○</div><div class="error" id="error"></div>
<div class="keypad" id="keys"></div>
<button id="cancel" style="background:none;color:#ddd">Cancel</button>
</div>
<div class="homebar" id="homebar"></div>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let pin='',appName='',notes=JSON.parse(localStorage.getItem('mavin-notes')||'["Shot list: Gotham rooftops","Buy film for the camera","Daily Bugle deadline: submit photos"]'),events=JSON.parse(localStorage.getItem('mavin-events')||'[]'),chats={},playing=false;

function tick(){
let d=new Date();
$('#clock').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
$('#lockclock').textContent=$('#clock').textContent;
$('#date').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
$('#day').textContent=d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase();
$('#num').textContent=d.getDate()
}
tick();
setInterval(tick,15000);

function showPin(){pin='';drawPin();$('#error').textContent='';$('#pin').classList.add('show')}
function drawPin(){$('#dots').textContent=Array.from({length:4},(_,i)=>i<pin.length?'●':'○').join(' ')}
function home(){
$('#pin').classList.remove('show');
$('#lock').classList.remove('active');
$('#app').classList.remove('active');
$('#home').classList.add('active')
}
function lock(){
$('#pin').classList.remove('show');
$('#home').classList.remove('active');
$('#app').classList.remove('active');
$('#lock').classList.add('active')
}
$('#unlock').onclick=showPin;
$('#cancel').onclick=()=>$('#pin').classList.remove('show');

for(let n=1;n<=9;n++){
let b=document.createElement('button');
b.textContent=n;
b.onclick=()=>addPin(''+n);
$('#keys').append(b)
}
$('#keys').append(document.createElement('span'));
let z=document.createElement('button');
z.textContent='0';
z.onclick=()=>addPin('0');
$('#keys').append(z);
let del=document.createElement('button');
del.textContent='⌫';
del.onclick=()=>{pin=pin.slice(0,-1);drawPin()};
$('#keys').append(del);

function addPin(n){
if(pin.length>=4)return;
pin+=n;drawPin();
if(pin.length===4){
if(pin==='1711')setTimeout(home,160);
else{
$('#error').textContent='Incorrect passcode';
setTimeout(()=>{pin='';drawPin()},650)
}
}
}

$$('[data-app]').forEach(b=>b.addEventListener('click',e=>{
if(e.target.closest('[data-control]'))return;
openApp(b.dataset.app)
}));
$('#back').onclick=home;
$('#lockBtn').onclick=lock;
$('#homebar').onclick=()=>$('#app').classList.contains('active')?home():showPin();

$('#musicWidget').addEventListener('click',e=>{
let control=e.target.closest('[data-control]');
if(control){
e.stopPropagation();
if(control.dataset.control==='play'){
playing=!playing;
control.textContent=playing?'Ⅱ':'▶'
}else{
control.textContent=control.dataset.control==='prev'?'◀|':'|▶';
setTimeout(()=>control.textContent=control.dataset.control==='prev'?'◀◀':'▶▶',500)
}
return
}
if(!e.target.closest('button'))openApp('Music')
});

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openApp(n){
appName=n;
$('#title').textContent=n;
$('#home').classList.remove('active');
$('#app').classList.add('active');
render(n)
}
function render(n){
let c=$('#content');
c.innerHTML='';
if(n==='Weather'){
c.innerHTML=`<div class="card" style="text-align:center;background:linear-gradient(140deg,#617d98,#263c51);color:white"><div>Bandung · Current weather</div><div style="font-size:65px;font-weight:250">61°</div>☁ Cloudy<p>H: 62° · L: 52°</p><p>Feels like 60° · Humidity 68% · Wind 8 km/h</p></div><h3>Hourly forecast</h3><div class="card">2 PM ☁ 61°　3 PM ☁ 62°　4 PM ☁ 61°</div><h3>10-day forecast</h3>${['Today · Cloudy · 62° / 52°','Friday · Partly cloudy · 63° / 51°','Saturday · Light rain · 60° / 50°'].map(x=>`<div class="item">${x}</div>`).join('')}<p class="notice">Demo weather, not live data.</p>`
}
else if(n==='WhatsApp'){
let names=['Sal','Kinan','Opi','Daily Bugle Desk','Peter','Aunt May','MJ','Flash'];
c.innerHTML=`<input class="field" id="search" placeholder="Search chats"><div id="chatlist">${names.map((x,i)=>`<button class="item" data-chat="${x}"><span class="avatar">${['🌻','📚','☕','📰','📷','🏠','🎧','🕸️'][i]}</span><span><b>${x}</b><br><span class="muted">${esc((chats[x]||['Hey, are we still on for today?']).slice(-1)[0])}</span></span><span style="margin-left:auto" class="muted">10:${12+i}</span></button>`).join('')}</div>`;
$$('[data-chat]').forEach(b=>b.onclick=()=>chat(b.dataset.chat));
$('#search').oninput=e=>$$('[data-chat]').forEach(b=>b.classList.toggle('hide',!b.dataset.chat.toLowerCase().includes(e.target.value.toLowerCase())))
}
</script>
