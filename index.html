/* FINAL LAYOUT PATCH: stable screens, fixed widget geometry, consistent icon shapes */
#phone{height:100dvh;min-height:0;max-width:430px}
.screen{display:none!important}
.screen.active{display:block!important}
#wall{z-index:0}
.status{z-index:50;height:38px;padding-top:max(8px,env(safe-area-inset-top));pointer-events:none}
.lock{z-index:30!important;touch-action:pan-y}
.lock img{z-index:0}
.lockdate,.locktime,.hint{z-index:2}
.home{z-index:2!important;padding:0;overflow:hidden}
.appscreen{z-index:35!important}
.pinpanel{z-index:60!important}
.homebar{z-index:70;pointer-events:auto}
/* Weather widget: each element gets its own non-overlapping area */
.weather{position:absolute;top:calc(7.2% + env(safe-area-inset-top));left:5%;width:90%;height:clamp(174px,23.5%,205px);padding:0;overflow:hidden;border-radius:29px}
.city{position:absolute;top:14px;left:17px;font-size:clamp(18px,5vw,22px);line-height:1.2}
.temp{position:absolute;top:48px;left:16px;margin:0;font-size:clamp(54px,15vw,66px);line-height:1;letter-spacing:-2px}
.desc{position:absolute;top:17px;right:15px;font-size:clamp(13px,3.8vw,17px);line-height:1.35;white-space:nowrap}
.hours{position:absolute;left:8px;right:8px;bottom:9px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;font-size:clamp(10px,3.1vw,13px);line-height:1.15}
.hours div{min-width:0;white-space:nowrap}
.hours b{font-size:clamp(17px,4.8vw,21px);margin:7px 0 6px;line-height:1;display:block}
.wlabel{position:absolute;top:calc(7.2% + env(safe-area-inset-top) + clamp(174px,23.5%,205px) + 7px);left:0;right:0;margin:0;text-align:center;font-size:16px}
/* Grid no longer lets the music widget change the row heights */
.app-layout{position:absolute;top:39%;left:5.5%;right:5.5%;height:36%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));column-gap:7px;row-gap:12px;align-items:start;overflow:visible}
.app-layout>.app{width:100%;min-width:0;gap:7px}
.app-layout>.app[style*="grid-row:1"]{grid-row:1!important}
.app-layout>.app[style*="grid-row:2"]{grid-row:2!important}
.app-layout>.app[style*="grid-row:3"]{grid-row:3!important}
.ico{width:clamp(54px,16vw,68px);max-width:100%;aspect-ratio:1;border-radius:22%;flex-shrink:0;display:grid;place-items:center;overflow:hidden;box-shadow:0 3px 9px #0002;font-size:clamp(28px,8vw,35px)}
.app label{font-size:clamp(11px,3.5vw,14px);line-height:1.2;white-space:nowrap}
.calendar{border-radius:22%;align-items:center;justify-content:center;gap:2px}
.calendar small{font-size:11px;line-height:1.1}
.calendar span{font-size:clamp(29px,8vw,35px);line-height:1}
/* Music is absolutely positioned, so it cannot push icons out of their rows */
.music{position:absolute;top:39%;left:54%;right:auto;width:41%;height:24%;min-height:0;max-height:255px;padding:13px;border-radius:25px;z-index:8;overflow:hidden;cursor:pointer}
.album{width:clamp(55px,16vw,68px);height:auto;aspect-ratio:1;border-radius:12px;margin-bottom:9px}
.song{font-size:clamp(12px,3.8vw,15px);line-height:1.25;overflow-wrap:anywhere}
.artist{font-size:clamp(12px,3.7vw,14px)}
.music .bar{margin:12px 0 5px}
.music .controls{margin-top:10px}
.music .controls button{min-width:25px;min-height:28px;padding:2px;font-size:clamp(13px,4vw,17px);border-radius:50%}
.musiclabel{position:absolute;top:calc(39% + 24% + 4px);left:54%;right:auto;width:41%;margin:0;text-align:center;font-size:14px;z-index:7;pointer-events:none}
.pages{bottom:calc(10% + env(safe-area-inset-bottom));z-index:4}
.dock{bottom:calc(2.5% + env(safe-area-inset-bottom));height:clamp(68px,9%,80px);left:5%;right:5%;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:7px 9px;z-index:10}
.dock .app{width:100%;height:100%;justify-content:center}
.dock .ico{width:clamp(48px,15vw,60px);border-radius:22%;font-size:clamp(25px,7vw,31px)}
/* Keep home-only furniture invisible while the lock screen is active */
#lock.active~#home .dock,#lock.active~#home .music,#lock.active~#home .musiclabel{display:none!important}
@media(max-height:730px){
 .weather{top:calc(6.5% + env(safe-area-inset-top));height:clamp(160px,22%,180px)}
 .wlabel{top:calc(6.5% + env(safe-area-inset-top) + clamp(160px,22%,180px) + 6px)}
 .app-layout{top:38%;height:35%;row-gap:8px}
 .music{top:38%;height:23.3%}
 .musiclabel{top:calc(38% + 23.3% + 4px)}
 .dock{height:68px;bottom:calc(2% + env(safe-area-inset-bottom))}
}
@media(min-width:600px){#phone{height:min(900px,100dvh)}.app-layout{left:23px;right:23px}.ico{width:68px}}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let pin='',appName='',notes=JSON.parse(localStorage.getItem('mavin-notes')||'["Shot list: Gotham rooftops","Buy film for the camera","Daily Bugle deadline: submit photos"]'),events=JSON.parse(localStorage.getItem('mavin-events')||'[]'),chats={},playing=false;
