
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#b8a78b">
<title>Mavin's iPhone</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --white: #fff;
  --glass: rgba(35, 38, 41, .88);
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #171717;
  color: white;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

.phone {
  position: relative;
  width: min(100vw, 430px);
  height: min(100dvh, 932px);
  min-height: 650px;
  overflow: hidden;
  isolation: isolate;
  background: #b8a78b;
}

.wallpaper {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

.wallpaper-shade {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.06),
    transparent 35%,
    rgba(0,0,0,.04)
  );
  z-index: -1;
  pointer-events: none;
}

/* STATUS BAR */

.status-bar {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 57px;
  padding: 14px 7% 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  font-size: 17px;
  font-weight: 650;
  text-shadow: 0 1px 4px #5557;
}

.status-right {
  display: flex;
  align-items: center;
  gap: 6px;
  padding-top: 2px;
}

.signal {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 15px;
}

.signal i {
  width: 4px;
  background: white;
  border-radius: 2px 2px 0 0;
  display: block;
}

.signal i:nth-child(1) { height: 5px; }
.signal i:nth-child(2) { height: 8px; }
.signal i:nth-child(3) { height: 11px; }
.signal i:nth-child(4) { height: 15px; }

.wifi {
  font-size: 17px;
  line-height: 1;
}

.battery {
  width: 24px;
  height: 12px;
  border: 1.5px solid white;
  border-radius: 3px;
  position: relative;
  margin-left: 2px;
}

.battery::before {
  content: "";
  position: absolute;
  right: -4px;
  top: 3px;
  width: 2px;
  height: 4px;
  background: white;
  border-radius: 0 2px 2px 0;
}

.battery::after {
  content: "";
  position: absolute;
  inset: 2px;
  width: 72%;
  background: white;
  border-radius: 1px;
}

/* WEATHER */

.weather-wrap {
  position: absolute;
  top: 12.2%;
  left: 8.7%;
  width: 82.6%;
}

.weather-card {
  height: clamp(178px, 28vh, 252px);
  min-height: 178px;
  padding: 17px 18px 13px;
  border-radius: 29px;
  background: linear-gradient(
    145deg,
    rgba(78, 94, 108, .94),
    rgba(31, 48, 62, .97)
  );
  box-shadow: 0 8px 22px #0002;
  overflow: hidden;
}

.weather-city {
  font-size: clamp(17px, 5.2vw, 25px);
  font-weight: 500;
  line-height: 1.2;
}

.weather-main {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 1px;
}

.temperature {
  font-size: clamp(48px, 15vw, 75px);
  line-height: 1.02;
  font-weight: 300;
  letter-spacing: -3px;
}

.weather-condition {
  text-align: right;
  padding-top: 8px;
  font-size: 15px;
  line-height: 1.45;
}

.weather-condition strong {
  display: block;
  font-size: 18px;
  font-weight: 500;
}

.forecast {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 2px;
  margin-top: 15px;
  text-align: center;
}

.forecast-item {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
}

.forecast-time {
  font-size: clamp(10px, 3.3vw, 13px);
  color: #e0e6eb;
}

.cloud {
  width: 26px;
  height: 18px;
  position: relative;
  margin-top: 4px;
}

.cloud::before {
  content: "";
  position: absolute;
  bottom: 1px;
  left: 2px;
  width: 22px;
  height: 10px;
  border-radius: 12px;
  background: #fff;
}

.cloud::after {
  content: "";
  position: absolute;
  bottom: 5px;
  left: 7px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 7px 4px 0 -1px #fff;
}

.forecast-temp {
  font-size: clamp(12px, 3.6vw, 15px);
  font-weight: 600;
}

.weather-label {
  text-align: center;
  font-size: 14px;
  font-weight: 500;
  margin-top: 7px;
  text-shadow: 0 1px 4px #0009;
}

/* APP AREA */

.app-area {
  position: absolute;
  top: 35%;
  left: 5.5%;
  right: 5.5%;
  height: 38%;
}

.app-icon {
  position: absolute;
  width: 23%;
  max-width: 86px;
  padding: 0;
  border: 0;
  background: transparent;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.app-icon img {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  border-radius: 23%;
  filter: drop-shadow(0 2px 2px #0002);
}

.app-icon span {
  width: 120%;
  font-size: clamp(12px, 4.1vw, 16px);
  font-weight: 450;
  line-height: 1.15;
  text-align: center;
  text-shadow: 0 1px 4px #000b;
  white-space: nowrap;
}

.whatsapp { left: 0; top: 0; }
.calendar { left: 31%; top: 0; }
.instagram { left: 0; top: 29%; }
.xapp { left: 31%; top: 29%; }
.spotify { left: 0; top: 58%; }
.photos { left: 31%; top: 58%; }
.notes { left: 62%; top: 58%; }
.youtube { left: 93%; top: 58%; transform: translateX(-100%); }

/* MUSIC WIDGET */

.music-widget {
  position: absolute;
  top: 0;
  left: 50%;
  width: 50%;
  height: 42%;
  min-height: 210px;
  max-height: 290px;
  padding: 13px;
  border-radius: 27px;
  background: rgba(38, 39, 40, .94);
  box-shadow: 0 7px 22px #0003;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.music-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}

.album-art {
  width: 44%;
  aspect-ratio: 1;
  flex-shrink: 0;
  overflow: hidden;
  border-radius: 10px;
  background:
    radial-gradient(ellipse at 60% 30%, #dedede 0 4%, transparent 5%),
    linear-gradient(145deg, #c7c7c7, #555 60%, #bcbcbc);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #333;
  font-size: 27px;
  position: relative;
}

.album-art::before {
  content: "♠";
  position: absolute;
  left: 12%;
  bottom: 7%;
  font-size: 34px;
  transform: rotate(30deg);
  color: #e6e6e6;
  text-shadow: 0 2px 5px #333;
}

.album-art::after {
  content: "♠";
  position: absolute;
  right: 14%;
  top: 5%;
  font-size: 25px;
  transform: rotate(205deg);
  color: #333;
}

.music-note {
  font-size: 29px;
  line-height: 1;
  padding-right: 2px;
}

.track-title {
  font-size: clamp(14px, 4.4vw, 17px);
  font-weight: 550;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.track-artist {
  margin-top: 2px;
  font-size: clamp(12px, 3.9vw, 15px);
  color: #d0d0d0;
}

.progress-area {
  margin-top: auto;
  padding-top: 11px;
}

.progress-track {
  width: 100%;
  height: 4px;
  background: #747474;
  border-radius: 8px;
  overflow: hidden;
}

.progress-fill {
  width: 42%;
  height: 100%;
  background: #e9e9e9;
  border-radius: 8px;
}

.track-times {
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
  font-size: 10px;
  color: #eee;
}

.music-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
}

.music-controls button {
  border: 0;
  padding: 0;
  background: transparent;
  width: 25%;
  font-size: 20px;
  line-height: 1;
}

.music-controls .play-button {
  font-size: 27px;
}

.music-controls .airplay {
  font-size: 22px;
  opacity: .9;
}

.music-label {
  position: absolute;
  top: 44%;
  left: 50%;
  width: 50%;
  text-align: center;
  font-size: 14px;
  text-shadow: 0 1px 4px #000c;
}

/* PAGE INDICATOR */

.page-dots {
  position: absolute;
  bottom: 16.5%;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 10px;
}

.page-dots span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,.5);
}

.page-dots span:first-child {
  background: white;
}

/* DOCK */

.dock {
  position: absolute;
  left: 5.5%;
  right: 5.5%;
  bottom: 3.2%;
  height: 10.3%;
  min-height: 80px;
  max-height: 105px;
  border-radius: 38px;
  background: rgba(190, 177, 154, .75);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  align-items: center;
  justify-items: center;
  padding: 9px 12px;
}

.dock button {
  border: 0;
  background: transparent;
  padding: 0;
  width: 78%;
  max-width: 65px;
}

.dock img {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  border-radius: 23%;
  filter: drop-shadow(0 2px 3px #0002);
}

/* SIMPLE APP OVERLAY */

.app-screen {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: none;
  flex-direction: column;
  background: #f7f7f7;
  color: #222;
}

.app-screen.active {
  display: flex;
}

.app-header {
  height: 65px;
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 0 20px;
  border-bottom: 1px solid #ddd;
  font-size: 19px;
  font-weight: 650;
}

.back-button {
  border: 0;
  background: transparent;
  color: #1677ff;
  font-size: 16px;
  padding: 8px 0;
}

.app-content {
  padding: 22px;
  overflow: auto;
  flex: 1;
}

.demo-card {
  padding: 18px;
  border-radius: 16px;
  background: white;
  box-shadow: 0 2px 12px #0000;
  margin-bottom: 12px;
}

.demo-card input,
.demo-card textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  margin-top: 8px;
  font: inherit;
}

.demo-card textarea {
  min-height: 110px;
  resize: vertical;
}

.app-footer {
  padding: 12px;
  text-align: center;
  color: #888;
  font-size: 12px;
}

/* SMALL SCREENS */

@media (max-height: 740px) {
  .weather-wrap { top: 10%; }
  .weather-card {
    height: 190px;
    min-height: 190px;
    padding-top: 12px;
  }
  .forecast { margin-top: 9px; }
  .app-area { top: 34%; }
  .music-widget { min-height: 190px; }
  .music-label { top: 44%; }
  .page-dots { bottom: 15%; }
  .dock { bottom: 2.5%; }
}

@media (min-width: 500px) {
  .phone {
    height: min(932px, 96dvh);
    border-radius: 32px;
    box-shadow: 0 20px 80px #0008;
  }
}
</style>
</head>

<body>
<main class="phone" id="phone">

  <img
    class="wallpaper"
    src="https://raw.githubusercontent.com/runweebss/Interactive-Winrina-AU/main/camera-wallpaper.jpg"
    alt="Wallpaper kamera"
    onerror="this.style.background='#b8a78b'"
  >
  <div class="wallpaper-shade"></div>

  <div class="status-bar">
    <span id="clock">10:24</span>
    <div class="status-right">
      <div class="signal"><i></i><i></i><i></i><i></i></div>
      <span class="wifi">◔</span>
      <div class="battery"></div>
    </div>
  </div>

  <section class="weather-wrap">
    <div class="weather-card">
      <div class="weather-city">Bandung</div>

      <div class="weather-main">
        <div class="temperature">61°</div>
        <div class="weather-condition">
          <strong>☁</strong>
          Cloudy<br>
          H:62° L:52°
        </div>
      </div>

      <div class="forecast">
        <div class="forecast-item">
          <span class="forecast-time">2PM</span>
          <span class="cloud"></span>
          <span class="forecast-temp">61°</span>
        </div>
        <div class="forecast-item">
          <span class="forecast-time">3PM</span>
          <span class="cloud"></span>
          <span class="forecast-temp">62°</span>
        </div>
        <div class="forecast-item">
          <span class="forecast-time">4PM</span>
          <span class="cloud"></span>
          <span class="forecast-temp">61°</span>
        </div>
        <div class="forecast-item">
          <span class="forecast-time">5PM</span>
          <span class="cloud"></span>
          <span class="forecast-temp">62°</span>
        </div>
        <div class="forecast-item">
          <span class="forecast-time">6PM</span>
          <span class="cloud"></span>
          <span class="forecast-temp">62°</span>
        </div>
        <div class="forecast-item">
          <span class="forecast-time">7PM</span>
          <span class="cloud"></span>
          <span class="forecast-temp">61°</span>
        </div>
      </div>
    </div>
    <div class="weather-label">Weather</div>
  </section>

  <section class="app-area">

    <button class="app-icon whatsapp" onclick="openApp('WhatsApp')">
      <img src="whatsapp%20logo.png" alt="WhatsApp">
      <span>WhatsApp</span>
    </button>

    <button class="app-icon calendar" onclick="openApp('Calendar')">
      <img src="calendar%20logo.png" alt="Calendar"
           onerror="this.outerHTML='<div style=&quot;width:100%;aspect-ratio:1;border-radius:23%;background:white;color:#222;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:35px&quot;><small style=&quot;color:#df4444;font-size:12px;font-weight:bold&quot;>TUE</small>9</div>'">
      <span>Calendar</span>
    </button>

    <button class="app-icon instagram" onclick="openApp('Instagram')">
      <img src="instagram%20logo.png" alt="Instagram">
      <span>Instagram</span>
    </button>

    <button class="app-icon xapp" onclick="openApp('X')">
      <img src="x%20logo.png" alt="X">
      <span>X</span>
    </button>

    <button class="app-icon spotify" onclick="openSpotify()">
      <img src="spotify%20logo.png" alt="Spotify">
      <span>Spotify</span>
    </button>

    <button class="app-icon photos" onclick="openApp('Photos')">
      <img src="photo%20logo.png" alt="Photos">
      <span>Photos</span>
    </button>

    <button class="app-icon notes" onclick="openApp('Notes')">
      <img src="notes%20logo.png" alt="Notes">
      <span>Notes</span>
    </button>

    <button class="app-icon youtube" onclick="openApp('YouTube')">
      <img src="youtube%20logo.png" alt="YouTube">
      <span>YouTube</span>
    </button>

    <section class="music-widget" aria-label="Music player">
      <div class="music-top">
        <div class="album-art" aria-label="Placeholder album art"></div>
        <span class="music-note">♫</span>
      </div>

      <div class="track-title">everything u are</div>
      <div class="track-artist">Hindia</div>

      <div class="progress-area">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="track-times">
          <span id="elapsed">1:53</span>
          <span>-2:04</span>
        </div>
      </div>

      <div class="music-controls">
        <button aria-label="Previous track" onclick="seekStart()">◀◀</button>
        <button class="play-button" id="playButton" aria-label="Open Spotify" onclick="openSpotify()">Ⅱ</button>
        <button aria-label="Next track" onclick="openSpotify()">▶▶</button>
        <button class="airplay" aria-label="Open Spotify" onclick="openSpotify()">◎</button>
      </div>
    </section>

    <div class="music-label">Music</div>
  </section>

  <div class="page-dots">
    <span></span><span></span><span></span>
  </div>

  <nav class="dock">
    <button onclick="openApp('Camera')" aria-label="Camera">
      <img src="camera%20logo.png" alt="Camera">
    </button>
    <button onclick="openApp('Calculator')" aria-label="Calculator">
      <img src="calculator%20logo.png" alt="Calculator">
    </button>
    <button onclick="openApp('Gmail')" aria-label="Gmail">
      <img src="gmail%20logo.png" alt="Gmail">
    </button>
    <button onclick="openApp('Settings')" aria-label="Settings">
      <img src="setting%20logo.png" alt="Settings">
    </button>
  </nav>

  <section class="app-screen" id="appScreen">
    <header class="app-header">
      <button class="back-button" onclick="closeApp()">‹ Home</button>
      <span id="appTitle">App</span>
    </header>
    <div class="app-content" id="appContent"></div>
    <div class="app-footer">Mavin's iPhone</div>
  </section>

</main>

<script>
const spotifyUrl =
  "https://open.spotify.com/track/5WOSNVChcadlsCRiqXE45K?si=eDLWuk--RMOb2kCRwV4k0w&utm_source=copy-link";

function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString("id-ID", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    });
}
updateClock();
setInterval(updateClock, 30000);

function openSpotify() {
  window.open(spotifyUrl, "_blank", "noopener,noreferrer");
}

function seekStart() {
  document.getElementById("progressFill").style.width = "0%";
  document.getElementById("elapsed").textContent = "0:00";
}

function openApp(name) {
  const screen = document.getElementById("appScreen");
  const title = document.getElementById("appTitle");
  const content = document.getElementById("appContent");

  title.textContent = name;

  const templates = {
    "WhatsApp": `
      <div class="demo-card">
        <h3>WhatsApp</h3>
        <p>Chats</p>
        <p>Belum ada percakapan demo.</p>
      </div>`,
    "Calendar": `
      <div class="demo-card">
        <h2>Selasa, 9</h2>
        <p>Kalender Mavin</p>
        <input type="text" placeholder="Tambah acara...">
      </div>`,
    "Instagram": `
      <div class="demo-card">
        <h3>Instagram</h3>
        <p>Feed belum tersedia di demo ini.</p>
      </div>`,
    "X": `
      <div class="demo-card">
        <h3>X</h3>
        <textarea placeholder="Apa yang sedang terjadi?!"></textarea>
      </div>`,
    "Spotify": `
      <div class="demo-card">
        <h3>♫ everything u are</h3>
        <p>Hindia</p>
        <button onclick="openSpotify()" style="background:#1db954;color:white;border:0;border-radius:20px;padding:12px 18px">
          Buka Spotify
        </button>
      </div>`,
    "Photos": `
      <div class="demo-card">
        <h3>Photos</h3>
        <p>Perpustakaan foto masih kosong.</p>
      </div>`,
    "Notes": `
      <div class="demo-card">
        <h3>Catatan baru</h3>
        <textarea placeholder="Tulis catatan di sini..."></textarea>
      </div>`,
    "YouTube": `
      <div class="demo-card">
        <h3>YouTube</h3>
        <p>Video belum tersedia di demo ini.</p>
      </div>`,
    "Camera": `
      <div class="demo-card">
        <h3>Camera</h3>
        <p>Simulasi kamera. Fitur kamera asli belum diaktifkan.</p>
      </div>`,
    "Calculator": `
      <div class="demo-card">
        <h3>Calculator</h3>
        <input id="calcInput" type="text" placeholder="Contoh: 12 + 5">
        <button onclick="calculate()" style="margin-top:10px;background:#ff9500;color:white;border:0;border-radius:10px;padding:10px 16px">Hitung</button>
        <p id="calcResult"></p>
      </div>`,
    "Gmail": `
      <div class="demo-card">
        <h3>Gmail</h3>
        <p>Belum ada email di demo ini.</p>
      </div>`,
    "Settings": `
      <div class="demo-card">
        <h3>Settings</h3>
        <p>Wi-Fi　Terhubung</p>
        <p>Bluetooth　Aktif</p>
        <p>Wallpaper　Kamera</p>
      </div>`
  };

  content.innerHTML = templates[name] || `
    <div class="demo-card"><h3>${name}</h3></div>`;

  screen.classList.add("active");
}

function closeApp() {
  document.getElementById("appScreen").classList.remove("active");
}

function calculate() {
  const input = document.getElementById("calcInput");
  const output = document.getElementById("calcResult");
  const expression = input.value.trim();

  if (!/^[0-9+\-*/().%\s]+$/.test(expression)) {
    output.textContent = "Masukkan perhitungan yang valid.";
    return;
  }

  try {
    const result = Function('"use strict"; return (' + expression + ')')();
    output.textContent = Number.isFinite(result)
      ? "= " + result
      : "Perhitungan tidak valid.";
  } catch {
    output.textContent = "Perhitungan tidak valid.";
  }
}
