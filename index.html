
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1b20">
<title>Mavin's iPhone</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #171717;
  color: white;
  overflow: hidden;
}

button {
  font: inherit;
  cursor: pointer;
  color: inherit;
}

.phone {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  min-height: 580px;
  overflow: hidden;
  isolation: isolate;
  background: #b9a98e;
  user-select: none;
  -webkit-user-select: none;
}

.wallpaper {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

.shade {
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(180deg, #0002, transparent 45%, #0001);
}

/* STATUS BAR */

.status {
  position: absolute;
  z-index: 2;
  top: 0;
  left: 0;
  width: 100%;
  height: 44px;
  padding: 10px 7%;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  font-size: 15px;
  font-weight: 650;
  text-shadow: 0 1px 4px #0005;
}

.status-right {
  display: flex;
  align-items: center;
  gap: 5px;
}

.signal {
  display: flex;
  align-items: flex-end;
  height: 14px;
  gap: 2px;
}

.signal i {
  width: 3px;
  background: white;
  border-radius: 2px 2px 0 0;
}

.signal i:nth-child(1) { height: 5px; }
.signal i:nth-child(2) { height: 8px; }
.signal i:nth-child(3) { height: 11px; }
.signal i:nth-child(4) { height: 14px; }

.battery {
  position: relative;
  width: 22px;
  height: 12px;
  border: 1.5px solid white;
  border-radius: 3px;
}

.battery::before {
  content: "";
  position: absolute;
  right: -4px;
  top: 3px;
  width: 2px;
  height: 4px;
  background: white;
}

.battery::after {
  content: "";
  position: absolute;
  left: 2px;
  top: 2px;
  bottom: 2px;
  width: 70%;
  background: white;
  border-radius: 1px;
}

/* LOCK SCREEN */

.lock-screen {
  position: absolute;
  inset: 0;
  z-index: 20;
  overflow: hidden;
  background: #080808;
  transition: opacity .3s ease, visibility .3s ease;
  touch-action: pan-y;
}

.lock-wallpaper {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.lock-shade {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    rgba(0,0,0,.12),
    transparent 38%,
    rgba(0,0,0,.3)
  );
}

.lock-clock {
  position: absolute;
  top: 15%;
  width: 100%;
  text-align: center;
  text-shadow: 0 2px 12px #0003;
  pointer-events: none;
}

.lock-date {
  font-size: clamp(17px, 4.5vw, 21px);
  font-weight: 550;
  margin-bottom: 2px;
}

.lock-time {
  font-size: clamp(76px, 22vw, 100px);
  line-height: 1.05;
  font-weight: 250;
  letter-spacing: -4px;
}

/* Only one swipe indicator. No extra home-indicator line. */
.lock-bottom {
  position: absolute;
  bottom: max(22px, env(safe-area-inset-bottom));
  width: 100%;
  text-align: center;
  padding: 0 24px;
  pointer-events: none;
}

.lock-hint {
  font-size: 14px;
  margin-bottom: 19px;
  text-shadow: 0 1px 4px #0009;
}

.swipe-indicator {
  width: 112px;
  height: 5px;
  margin: 0 auto;
  border-radius: 10px;
  background: white;
  animation: floatUp 1.8s ease-in-out infinite;
}

@keyframes floatUp {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* PASSCODE */

.passcode-screen {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: none;
  flex-direction: column;
  align-items: center;
  padding: 12vh 30px 35px;
  background: rgba(28,27,32,.97);
  color: white;
}

.passcode-screen.active {
  display: flex;
}

.passcode-title {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 9px;
}

.passcode-subtitle {
  font-size: 14px;
  color: #ccc;
  margin-bottom: 24px;
  text-align: center;
}

.pin-dots {
  display: flex;
  gap: 17px;
  margin-bottom: 30px;
}

.pin-dot {
  width: 11px;
  height: 11px;
  border: 1px solid white;
  border-radius: 50%;
}

.pin-dot.filled {
  background: white;
}

.pin-pad {
  display: grid;
  grid-template-columns: repeat(3, 66px);
  gap: 12px 19px;
  justify-content: center;
}

.pin-key {
  width: 66px;
  height: 66px;
  border: 0;
  border-radius: 50%;
  background: #ffffff22;
  font-size: 27px;
  font-weight: 350;
}

.pin-key:active {
  background: #ffffff45;
}

.pin-key small {
  display: block;
  font-size: 8px;
  letter-spacing: 2px;
}

.pin-bottom {
  margin-top: auto;
  width: 100%;
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}

.pin-bottom button {
  border: 0;
  background: transparent;
}

.pin-error {
  min-height: 20px;
  font-size: 12px;
  color: #ffb4b4;
  margin-top: -21px;
  margin-bottom: 12px;
}

/* HOME SCREEN */

.home-screen {
  position: absolute;
  inset: 0;
  opacity: 0;
  visibility: hidden;
  transition: opacity .25s ease;
}

.home-screen.active {
  opacity: 1;
  visibility: visible;
}

/* WEATHER: moved upward, with a clear gap below */

.weather-wrap {
  position: absolute;
  top: 9.2%;
  left: 8.7%;
  width: 82.6%;
}

.weather-card {
  height: clamp(174px, 23.5vh, 300px);
  min-height: 174px;
  padding: clamp(12px, 2.1vh, 19px) clamp(14px, 3.8vw, 25px) 10px;
  overflow: hidden;
  border-radius: clamp(23px, 5vw, 34px);
  background: linear-gradient(
    145deg,
    rgba(77,93,107,.96),
    rgba(31,48,62,.98)
  );
  box-shadow: 0 8px 22px #0002;
}

.city {
  font-size: clamp(20px, 5.5vw, 27px);
  font-weight: 600;
}

.weather-main {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.temperature {
  font-size: clamp(49px, 13vw, 66px);
  line-height: 1.08;
  font-weight: 300;
  letter-spacing: -2px;
}

.condition {
  text-align: right;
  padding-top: 4px;
  font-size: clamp(11px, 3.2vw, 14px);
  line-height: 1.4;
}

.condition strong {
  display: block;
  font-size: clamp(21px, 5vw, 27px);
  font-weight: 500;
}

.condition .high-low {
  white-space: nowrap;
}

.forecast {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 2px;
  margin-top: clamp(7px, 1.2vh, 13px);
  text-align: center;
}

.forecast-item {
  display: flex;
  min-width: 0;
  flex-direction: column;
  align-items: center;
  gap: clamp(3px, .7vh, 6px);
}

.forecast-time {
  font-size: clamp(10px, 3vw, 14px);
  color: #e3e7eb;
}

.cloud {
  position: relative;
  width: clamp(23px, 6vw, 31px);
  height: clamp(17px, 4.6vw, 21px);
  margin-top: 1px;
}

.cloud::before {
  content: "";
  position: absolute;
  left: 2px;
  bottom: 2px;
  width: 22px;
  height: 9px;
  border-radius: 10px;
  background: white;
}

.cloud::after {
  content: "";
  position: absolute;
  left: 7px;
  bottom: 5px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: white;
  box-shadow: 7px 4px 0 -1px white;
}

.forecast-temp {
  font-size: clamp(11px, 3.1vw, 14px);
  font-weight: 650;
}

.weather-label {
  margin-top: 5px;
  text-align: center;
  font-size: 12px;
  text-shadow: 0 1px 4px #000a;
}

/* APP GRID: consistent columns and vertical spacing */

.home-grid {
  position: absolute;
  top: 38.5%;
  left: 7%;
  right: 7%;
  height: 65vw;
  max-height: 500px;
}

.app {
  position: absolute;
  width: 18%;
  padding: 0;
  border: 0;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

.app img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  border-radius: 22%;
  filter: drop-shadow(0 1px 2px #0002);
}

.app-name {
  width: 145%;
  text-align: center;
  font-size: clamp(11px, 3.2vw, 14px);
  line-height: 1.15;
  white-space: nowrap;
  text-shadow: 0 1px 4px #000d;
}

.whatsapp { left: 0; top: 0; }
.calendar { left: 25%; top: 0; }
.instagram { left: 0; top: 28vw; }
.xapp { left: 25%; top: 28vw; }
.spotify { left: 0; top: 61vw; }
.photos { left: 25%; top: 61vw; }
.notes { left: 50%; top: 61vw; }
.youtube { left: 75%; top: 61vw; }

.calendar-fallback {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 23%;
  background: white;
  color: #171717;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-size: clamp(25px, 7vw, 36px);
  font-weight: 800;
}

.calendar-fallback small {
  color: #d64545;
  font-size: 11px;
  font-weight: 850;
}

/* MUSIC PLAYER: square widget and evenly spaced controls */

.music-wrap {
  position: absolute;
  top: 0;
  left: 50%;
  width: 50%;
  padding-left: 8px;
}

.music-widget {
  width: 100%;
  aspect-ratio: 1 / 1;
  min-height: 0;
  padding: clamp(9px, 1.6vw, 13px);
  border-radius: clamp(23px, 5vw, 31px);
  background: rgba(38,39,41,.97);
  box-shadow: 0 6px 20px #0003;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.music-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-shrink: 0;
  margin-bottom: clamp(6px, 1vw, 9px);
}

.album-art {
  display: block;
  width: 43%;
  aspect-ratio: 1 / 1;
  flex-shrink: 0;
  object-fit: cover;
  border-radius: 10px;
  background: #777;
}

.music-note {
  font-size: clamp(23px, 5vw, 31px);
  line-height: 1;
  padding: 2px 2px 0 0;
}

.track-title {
  font-size: clamp(12px, 3.6vw, 17px);
  line-height: 1.2;
  font-weight: 550;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.track-artist {
  font-size: clamp(11px, 3.4vw, 15px);
  color: #d1d1d1;
  margin-top: 3px;
}

.progress-area {
  margin-top: auto;
  padding-top: 8px;
  flex-shrink: 0;
}

.progress-track {
  width: 100%;
  height: 5px;
  background: #777;
  border-radius: 10px;
  overflow: hidden;
}

.progress-fill {
  width: 48%;
  height: 100%;
  background: #eee;
  border-radius: inherit;
}

.track-times {
  display: flex;
  justify-content: space-between;
  font-size: clamp(10px, 2.9vw, 13px);
  margin-top: 5px;
}

/* Four equal-width button slots keep the icons aligned */
.music-controls {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  align-items: center;
  justify-items: center;
  width: 100%;
  margin-top: clamp(7px, 1.2vw, 11px);
  flex-shrink: 0;
}

.music-controls button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-width: 0;
  height: clamp(25px, 7vw, 32px);
  padding: 0;
  border: 0;
  background: transparent;
  color: white;
  line-height: 1;
}

.music-controls .skip-button {
  font-size: clamp(13px, 3.5vw, 19px);
  letter-spacing: -3px;
  padding-right: 3px;
}

.music-controls .play-button {
  font-size: clamp(23px, 6vw, 31px);
}

.music-controls .airplay {
  font-size: clamp(17px, 4.5vw, 23px);
}

.music-controls button:active {
  opacity: .55;
}

.music-label {
  margin-top: 5px;
  text-align: center;
  font-size: 12px;
  text-shadow: 0 1px 4px #000c;
}

/* PAGE DOTS */

.page-dots {
  position: absolute;
  bottom: 15%;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 9px;
}

.page-dots span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ffffff80;
}

.page-dots span:first-child {
  background: white;
}

/* DOCK */

.dock {
  position: absolute;
  left: 7%;
  right: 7%;
  bottom: 3%;
  height: 9%;
  min-height: 68px;
  max-height: 92px;
  border-radius: 35px;
  background: rgba(190,177,154,.84);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  align-items: center;
  justify-items: center;
  padding: 7px 10px;
}

.dock button {
  width: 72%;
  max-width: 61px;
  padding: 0;
  border: 0;
  background: transparent;
}

.dock img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  border-radius: 23%;
}

/* DEMO APP WINDOWS */

.app-screen {
  position: absolute;
  inset: 0;
  z-index: 15;
  display: none;
  flex-direction: column;
  background: #f5f5f7;
  color: #222;
}

.app-screen.active {
  display: flex;
}

.app-header {
  min-height: 60px;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  gap: 16px;
  border-bottom: 1px solid #ddd;
  font-size: 18px;
  font-weight: 650;
}

.back-button {
  border: 0;
  background: transparent;
  color: #087bfa;
  font-size: 16px;
}

.app-content {
  padding: 20px;
  overflow: auto;
  flex: 1;
}

.demo-card {
  padding: 18px;
  border-radius: 16px;
  background: white;
  margin-bottom: 12px;
}

.demo-card textarea,
.demo-card input {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font: inherit;
}

.demo-card textarea {
  min-height: 110px;
}

.app-footer {
  padding: 12px;
  text-align: center;
  font-size: 12px;
  color: #888;
}

/* SHORTER SCREENS */

@media (max-height: 740px) {
  .weather-wrap {
    top: 8.5%;
  }

  .weather-card {
    height: 165px;
    min-height: 165px;
    padding-top: 10px;
  }

  .forecast {
    margin-top: 5px;
  }

  .home-grid {
    top: 37%;
  }

  .music-widget {
    padding: 8px;
  }

  .music-controls {
    margin-top: 5px;
  }

  .page-dots {
    bottom: 13%;
  }

  .dock {
    bottom: 2%;
  }

  .lock-clock {
    top: 12%;
  }

  .lock-bottom {
    bottom: max(22px, env(safe-area-inset-bottom));
  }
}

@media (max-width: 360px) {
  .music-wrap {
    padding-left: 5px;
  }

  .music-widget {
    padding: 7px;
    border-radius: 20px;
  }

  .track-title {
    font-size: 11px;
  }

  .music-controls .skip-button {
    letter-spacing: -4px;
  }

  .weather-card {
    padding-left: 11px;
    padding-right: 11px;
  }
}
</style>
</head>

<body>
<main class="phone">

  <!-- LOCK SCREEN -->
  <section class="lock-screen" id="lockScreen">
    <img
      class="lock-wallpaper"
      src="alohomora-lockscreen.jpg"
      alt="Lock screen wallpaper"
      onerror="this.style.display='none';document.getElementById('lockScreen').style.backgroundImage='linear-gradient(135deg,#665d50,#080808)'"
    >
    <div class="lock-shade"></div>

    <header class="status">
      <span id="lockStatusTime">10:24</span>
      <div class="status-right">
        <div class="signal"><i></i><i></i><i></i><i></i></div>
        <span>◔</span>
        <div class="battery"></div>
      </div>
    </header>

    <div class="lock-clock">
      <div class="lock-date" id="lockDate">Thursday, October 29</div>
      <div class="lock-time" id="lockTime">10:24</div>
    </div>

    <div class="lock-bottom">
      <div class="lock-hint">Swipe up to open</div>
      <div class="swipe-indicator" aria-hidden="true"></div>
    </div>
  </section>

  <!-- PASSCODE -->
  <section class="passcode-screen" id="passcodeScreen">
    <div class="passcode-title">Enter Passcode</div>
    <div class="passcode-subtitle">Enter your passcode to unlock iPhone</div>

    <div class="pin-dots" id="pinDots">
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
    </div>

    <div class="pin-error" id="pinError"></div>

    <div class="pin-pad">
      <button class="pin-key" onclick="enterPin('1')">1<small>&nbsp;</small></button>
      <button class="pin-key" onclick="enterPin('2')">2<small>ABC</small></button>
      <button class="pin-key" onclick="enterPin('3')">3<small>DEF</small></button>
      <button class="pin-key" onclick="enterPin('4')">4<small>GHI</small></button>
      <button class="pin-key" onclick="enterPin('5')">5<small>JKL</small></button>
      <button class="pin-key" onclick="enterPin('6')">6<small>MNO</small></button>
      <button class="pin-key" onclick="enterPin('7')">7<small>PQRS</small></button>
      <button class="pin-key" onclick="enterPin('8')">8<small>TUV</small></button>
      <button class="pin-key" onclick="enterPin('9')">9<small>WXYZ</small></button>
      <button class="pin-key" style="visibility:hidden"></button>
      <button class="pin-key" onclick="enterPin('0')">0<small>&nbsp;</small></button>
      <button class="pin-key" onclick="deletePin()" style="font-size:14px">Delete</button>
    </div>

    <div class="pin-bottom">
      <button onclick="hidePasscode()">Cancel</button>
      <span></span>
    </div>
  </section>

  <!-- HOME SCREEN -->
  <section class="home-screen" id="homeScreen">
    <img
      class="wallpaper"
      src="https://raw.githubusercontent.com/runweebss/Interactive-Winrina-AU/main/camera-wallpaper.jpg"
      alt="Camera wallpaper"
    >
    <div class="shade"></div>

    <header class="status">
      <span id="homeStatusTime">10:24</span>
      <div class="status-right">
        <div class="signal"><i></i><i></i><i></i><i></i></div>
        <span>◔</span>
        <div class="battery"></div>
      </div>
    </header>

    <!-- WEATHER -->
    <section class="weather-wrap">
      <div class="weather-card">
        <div class="city">Bandung</div>

        <div class="weather-main">
          <div class="temperature">26°</div>
          <div class="condition">
            <strong>☁</strong>
            Cloudy<br>
            <span class="high-low">H:27° L:22°</span>
          </div>
        </div>

        <div class="forecast">
          <div class="forecast-item"><span class="forecast-time">2PM</span><span class="cloud"></span><span class="forecast-temp">26°</span></div>
          <div class="forecast-item"><span class="forecast-time">3PM</span><span class="cloud"></span><span class="forecast-temp">27°</span></div>
          <div class="forecast-item"><span class="forecast-time">4PM</span><span class="cloud"></span><span class="forecast-temp">26°</span></div>
          <div class="forecast-item"><span class="forecast-time">5PM</span><span class="cloud"></span><span class="forecast-temp">27°</span></div>
          <div class="forecast-item"><span class="forecast-time">6PM</span><span class="cloud"></span><span class="forecast-temp">26°</span></div>
          <div class="forecast-item"><span class="forecast-time">7PM</span><span class="cloud"></span><span class="forecast-temp">25°</span></div>
        </div>
      </div>
      <div class="weather-label">Weather</div>
    </section>

    <!-- APP GRID -->
    <section class="home-grid">

      <button class="app whatsapp" onclick="openApp('WhatsApp')">
        <img src="whatsapp%20logo.png" alt="WhatsApp">
        <span class="app-name">WhatsApp</span>
      </button>

      <button class="app calendar" onclick="openApp('Calendar')">
        <img
          src="calendar%20logo.png"
          alt="Calendar"
          onerror="this.outerHTML='<div class=&quot;calendar-fallback&quot;><small>THU</small>29</div>'"
        >
        <span class="app-name">Calendar</span>
      </button>

      <button class="app instagram" onclick="openApp('Instagram')">
        <img src="instagram%20logo.png" alt="Instagram">
        <span class="app-name">Instagram</span>
      </button>

      <button class="app xapp" onclick="openApp('X')">
        <img src="x%20logo.png" alt="X">
        <span class="app-name">X</span>
      </button>

      <button class="app spotify" onclick="openSpotify()">
        <img src="spotify%20logo.png" alt="Spotify">
        <span class="app-name">Spotify</span>
      </button>

      <button class="app photos" onclick="openApp('Photos')">
        <img src="photo%20logo.png" alt="Photos">
        <span class="app-name">Photos</span>
      </button>

      <button class="app notes" onclick="openApp('Notes')">
        <img src="notes%20logo.png" alt="Notes">
        <span class="app-name">Notes</span>
      </button>

      <button class="app youtube" onclick="openApp('YouTube')">
        <img src="youtube%20logo.png" alt="YouTube">
        <span class="app-name">YouTube</span>
      </button>

      <!-- SQUARE MUSIC PLAYER -->
      <div class="music-wrap">
        <section class="music-widget" aria-label="Music player">

          <div class="music-top">
            <img
              class="album-art"
              src="https://raw.githubusercontent.com/runweebss/mavin-iphone/feb271aa049efe1d2556f12ff488f8e57fb24d9a/hindia%20everything%20u%20are.jpg"
              alt="Hindia - everything u are"
            >
            <span class="music-note" aria-hidden="true">♫</span>
          </div>

          <div class="track-title">everything u are</div>
          <div class="track-artist">Hindia</div>

          <div class="progress-area">
            <div class="progress-track">
              <div class="progress-fill"></div>
            </div>
            <div class="track-times">
              <span>1:53</span>
              <span>-2:04</span>
            </div>
          </div>

          <div class="music-controls">
            <button class="skip-button" aria-label="Previous track" onclick="openSpotify()">◀◀</button>
            <button
              class="play-button"
              id="playButton"
              aria-label="Play"
              aria-pressed="false"
              onclick="togglePlayback()"
            >▶</button>
            <button class="skip-button" aria-label="Next track" onclick="openSpotify()">▶▶</button>
            <button class="airplay" aria-label="Open Spotify" onclick="openSpotify()">◎</button>
          </div>

        </section>
        <div class="music-label">Music</div>
      </div>
    </section>

    <div class="page-dots">
      <span></span><span></span><span></span>
    </div>

    <!-- DOCK -->
    <nav class="dock">
      <button onclick="openApp('Camera')" aria-label="Camera"><img src="camera%20logo.png" alt="Camera"></button>
      <button onclick="openApp('Calculator')" aria-label="Calculator"><img src="calculator%20logo.png" alt="Calculator"></button>
      <button onclick="openApp('Gmail')" aria-label="Gmail"><img src="gmail%20logo.png" alt="Gmail"></button>
      <button onclick="openApp('Settings')" aria-label="Settings"><img src="setting%20logo.png" alt="Settings"></button>
    </nav>
  </section>

  <!-- DEMO APP WINDOWS -->
  <section class="app-screen" id="appScreen">
    <header class="app-header">
      <button class="back-button" onclick="closeApp()">‹ Home</button>
      <span id="appTitle">App</span>
    </header>
    <div class="app-content" id="appContent"></div>
    <div class="app-footer">Mavin's iPhone</div>
  </section>

</main>

<script>
const CORRECT_PIN = "1711";

const spotifyUrl =
  "https://open.spotify.com/track/5WOSNVChcadlsCRiqXE45K?si=eDLWuk--RMOb2kCRwV4k0w&utm_source=copy-link";

let enteredPin = "";
let isPlaying = false;
let touchStartY = 0;
let touchStartX = 0;

function updateClock() {
  const now = new Date();

  const time = now.toLocaleTimeString("en-GB", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });

  document.getElementById("lockTime").textContent = time;
  document.getElementById("lockStatusTime").textContent = time;
  document.getElementById("homeStatusTime").textContent = time;

  document.getElementById("lockDate").textContent =
    now.toLocaleDateString("en-US", {
      weekday: "long",
      day: "numeric",
      month: "long"
    });
}

updateClock();
setInterval(updateClock, 30000);

/* SWIPE UP TO OPEN PASSCODE */

const lockScreen = document.getElementById("lockScreen");

lockScreen.addEventListener("touchstart", function(event) {
  if (document.getElementById("passcodeScreen").classList.contains("active")) return;

  const touch = event.changedTouches[0];
  touchStartY = touch.screenY;
  touchStartX = touch.screenX;
}, { passive: true });

lockScreen.addEventListener("touchend", function(event) {
  if (document.getElementById("passcodeScreen").classList.contains("active")) return;

  const touch = event.changedTouches[0];
  const deltaY = touchStartY - touch.screenY;
  const deltaX = Math.abs(touch.screenX - touchStartX);

  if (deltaY > 45 && deltaY > deltaX * 1.15) {
    showPasscode();
  }
}, { passive: true });

let mouseStartY = 0;

lockScreen.addEventListener("mousedown", function(event) {
  mouseStartY = event.clientY;
});

lockScreen.addEventListener("mouseup", function(event) {
  const deltaY = mouseStartY - event.clientY;

  if (
    deltaY > 45 &&
    !document.getElementById("passcodeScreen").classList.contains("active")
  ) {
    showPasscode();
  }
});

/* PASSCODE */

function showPasscode() {
  enteredPin = "";
  updatePinDots();
  document.getElementById("pinError").textContent = "";
  document.getElementById("passcodeScreen").classList.add("active");
}

function hidePasscode() {
  document.getElementById("passcodeScreen").classList.remove("active");
}

function enterPin(number) {
  if (enteredPin.length >= 4) return;

  enteredPin += number;
  updatePinDots();

  if (enteredPin.length === 4) {
    if (enteredPin === CORRECT_PIN) {
      setTimeout(unlockPhone, 180);
    } else {
      document.getElementById("pinError").textContent =
        "Incorrect passcode. Try again.";

      setTimeout(() => {
        enteredPin = "";
        updatePinDots();
        document.getElementById("pinError").textContent = "";
      }, 650);
    }
  }
}

function deletePin() {
  enteredPin = enteredPin.slice(0, -1);
  updatePinDots();
  document.getElementById("pinError").textContent = "";
}

function updatePinDots() {
  document.querySelectorAll(".pin-dot").forEach((dot, index) => {
    dot.classList.toggle("filled", index < enteredPin.length);
  });
}

function unlockPhone() {
  document.getElementById("passcodeScreen").classList.remove("active");

  const lock = document.getElementById("lockScreen");
  lock.style.opacity = "0";
  lock.style.visibility = "hidden";

  document.getElementById("homeScreen").classList.add("active");
}

/* MUSIC PLAYER VISUAL TOGGLE */

function togglePlayback() {
  isPlaying = !isPlaying;

  const button = document.getElementById("playButton");
  button.textContent = isPlaying ? "Ⅱ" : "▶";
  button.setAttribute("aria-label", isPlaying ? "Pause" : "Play");
  button.setAttribute("aria-pressed", String(isPlaying));
}

function openSpotify() {
  window.open(spotifyUrl, "_blank", "noopener,noreferrer");
}

/* DEMO APPS */

function openApp(name) {
  const screen = document.getElementById("appScreen");
  const title = document.getElementById("appTitle");
  const content = document.getElementById("appContent");

  title.textContent = name;

  const pages = {
    "WhatsApp": `
      <div class="demo-card">
        <h3>WhatsApp</h3>
        <p>Chats</p>
        <p>No conversations in this demo yet.</p>
      </div>`,

    "Calendar": `
      <div class="demo-card">
        <h2>October 29</h2>
        <p>Mavin's Calendar</p>
        <input placeholder="Add an event...">
      </div>`,

    "Instagram": `
      <div class="demo-card">
        <h3>Instagram</h3>
        <p>The demo feed is not available yet.</p>
      </div>`,

    "X": `
      <div class="demo-card">
        <h3>Post</h3>
        <textarea placeholder="What's happening?"></textarea>
      </div>`,

    "Photos": `
      <div class="demo-card">
        <h3>Photos</h3>
        <p>Your demo album is empty.</p>
      </div>`,

    "Notes": `
      <div class="demo-card">
        <h3>New Note</h3>
        <textarea placeholder="Write a note..."></textarea>
      </div>`,

    "YouTube": `
      <div class="demo-card">
        <h3>YouTube</h3>
        <p>No videos are available in this demo yet.</p>
      </div>`,

    "Camera": `
      <div class="demo-card">
        <h3>Camera</h3>
        <p>This is a camera interface simulation.</p>
      </div>`,

    "Calculator": `
      <div class="demo-card">
        <h3>Calculator</h3>
        <input id="calcA" type="number" placeholder="First number">
        <input id="calcB" type="number" placeholder="Second number">
        <button
          onclick="calculate()"
          style="margin-top:10px;padding:10px 16px;background:#ff9500;color:white;border:0;border-radius:10px"
        >Add</button>
        <p id="calcResult"></p>
      </div>`,

    "Gmail": `
      <div class="demo-card">
        <h3>Gmail</h3>
        <p>Email is not available in this demo yet.</p>
      </div>`,

    "Settings": `
      <div class="demo-card">
        <h3>Settings</h3>
        <p>Wi-Fi　Connected</p>
        <p>Bluetooth　On</p>
        <p>Wallpaper　Camera</p>
        <p>Language　English</p>
        <button
          onclick="lockPhone()"
          style="padding:10px 15px;border:0;border-radius:10px;background:#ddd;color:#222"
        >Lock iPhone</button>
      </div>`
  };

  content.innerHTML = pages[name] || `
    <div class="demo-card"><h3>${name}</h3></div>`;

  screen.classList.add("active");
}

function closeApp() {
  document.getElementById("appScreen").classList.remove("active");
}

function calculate() {
  const a = Number(document.getElementById("calcA").value);
  const b = Number(document.getElementById("calcB").value);

  document.getElementById("calcResult").textContent = "Result: " + (a + b);
}

function lockPhone() {
  closeApp();
  document.getElementById("homeScreen").classList.remove("active");

  const lock = document.getElementById("lockScreen");
  lock.style.visibility = "visible";
  lock.style.opacity = "1";

  hidePasscode();
  enteredPin = "";
  updatePinDots();
}
</script>
</body>
</html>
