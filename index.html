
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101014">
<title>Mavin's iPhone</title>
<style>
:root{--blue:#087cff;--ink:#17171b;--paper:#f2f2f7;--muted:#8e8e93;--line:#e3e3e8;--orange:#ff9f0a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{background:#101014;color:#fff}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#phone{height:100dvh;max-width:430px;margin:auto;position:relative;overflow:hidden;background:#1b1b20;isolation:isolate}
#wall{position:absolute;inset:0;background:url('https://raw.githubusercontent.com/runweebss/Interactive-Winrina-AU/main/camera-wallpaper.jpg') center/cover;z-index:-2}
#wall:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0001,#0002 55%,#0004)}
.status{position:absolute;z-index:12;top:8px;left:7%;right:7%;display:flex;justify-content:space-between;font-size:14px;font-weight:700;text-shadow:0 1px 5px #000;pointer-events:none}
.screen{position:absolute;inset:0;display:none;z-index:2}
.screen.active{display:block}
.lock{z-index:15;background:#000}
.lock img{width:100%;height:100%;object-fit:cover;position:absolute}
.fallback{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#f6d9a5;background:linear-gradient(135deg,#111,#493b31)}
.locktime{position:absolute;top:10%;width:100%;text-align:center;font-size:76px;letter-spacing:-3px;font-weight:200;text-shadow:0 2px 8px #000}
.lockdate{position:absolute;top:7%;width:100%;text-align:center;font-size:16px;font-weight:600;text-shadow:0 2px 8px #000}
.hint{position:absolute;bottom:6%;left:0;width:100%;padding:18px;background:none;color:#fff;text-shadow:0 1px 5px #000;font-size:14px}
.home{padding:56px 6% 122px;overflow:auto;scrollbar-width:none}
.home::-webkit-scrollbar,.appscreen::-webkit-scrollbar{display:none}
.weather{width:100%;height:205px;border-radius:25px;background:linear-gradient(145deg,rgba(79,104,128,.88),rgba(28,45,63,.9));padding:16px;text-align:left;position:relative;box-shadow:0 10px 25px #0002;backdrop-filter:blur(15px)}
.city{font-size:18px;font-weight:500}
.temp{font-size:56px;line-height:1.15;font-weight:250;letter-spacing:-2px}
.desc{position:absolute;right:16px;top:53px;text-align:right;font-size:13px;line-height:1.45}
.hours{display:flex;justify-content:space-between;text-align:center;font-size:10px;margin-top:13px;color:#f4f6fa}
.hours b{display:block;font-size:18px;margin:5px 0;font-weight:400}
.wlabel{text-align:center;margin:7px 0 17px;font-size:12px;text-shadow:0 1px 5px #000}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px 7px}
.app{display:flex;align-items:center;flex-direction:column;gap:5px;background:none;text-shadow:0 1px 4px #000;min-width:0;padding:0}
.ico{width:min(100%,62px);aspect-ratio:1;border-radius:15px;display:grid;place-items:center;font-size:31px;font-weight:600;box-shadow:0 4px 9px #0002;overflow:hidden}
.app label{font-size:11px;white-space:nowrap}
.wa{background:#25d366}
.calendar{background:#fff;color:#161619;display:flex;flex-direction:column;justify-content:center;line-height:1}
.calendar small{font-size:10px;color:#e53935;font-weight:700}
.ig{background:radial-gradient(circle at 30% 100%,#ffd66d,#f34c5e 48%,#8238ce)}
.x{background:#000}
.spotify{background:#111;color:#1ed760}
.photos{background:#fff;color:#ef7359}
.notes{background:linear-gradient(#ffcf4b 20%,white 20%);color:#999}
.yt{background:#fff;color:#f00}
.music{position:absolute;top:34%;right:6%;width:43%;min-height:204px;padding:13px;border-radius:23px;background:rgba(32,32,35,.82);text-align:left;backdrop-filter:blur(22px);box-shadow:0 8px 24px #0003;z-index:3;border:1px solid #ffffff14}
.album{width:65px;height:65px;border-radius:9px;background:linear-gradient(135deg,#b6b6b8,#35353a);display:grid;place-items:center;font-size:28px;margin-bottom:8px}
.song{font-size:14px;font-weight:650;letter-spacing:-.2px}
.artist{font-size:12px;color:#d1d1d6;margin-top:3px}
.bar{height:3px;background:#777;margin:13px 0 5px;border-radius:4px}
.bar i{display:block;width:46%;height:100%;background:white}
.track{display:flex;justify-content:space-between;font-size:9px;color:#ddd}
.controls{display:flex;justify-content:space-between;margin-top:9px}
.controls button{background:none;font-size:16px;padding:2px 4px}
.musiclabel{position:absolute;right:14%;top:calc(34% + 209px);font-size:12px;text-shadow:0 1px 5px #000}
.pages{position:absolute;bottom:105px;width:100%;text-align:center;letter-spacing:7px;font-size:12px}
.dock{position:absolute;bottom:15px;left:5%;right:5%;height:82px;border-radius:27px;background:rgba(235,225,212,.72);backdrop-filter:blur(25px) saturate(150%);-webkit-backdrop-filter:blur(25px) saturate(150%);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:8px;z-index:6;border:1px solid #ffffff38}
.dock .app{position:relative;z-index:7;pointer-events:auto}
.dock .ico{width:55px;border-radius:14px;pointer-events:none}
.appscreen{background:var(--paper);color:var(--ink);overflow:auto;padding-bottom:34px;z-index:4;scrollbar-width:none}
.topbar{position:sticky;top:0;background:rgba(249,249,251,.91);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding:13px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #d8d8dd;z-index:5;min-height:54px}
.topbar button{background:none;color:var(--blue);font-size:16px}
.topbar strong{font-size:17px;font-weight:650}
.content{padding:17px 16px 28px}
.content h2{font-size:29px;letter-spacing:-.8px;margin:5px 0 16px}
.content h3{font-size:19px;letter-spacing:-.3px;margin:20px 0 10px}
.card{background:#fff;color:var(--ink);border-radius:17px;padding:15px;margin-bottom:12px;box-shadow:0 1px 2px #00000005}
.muted{color:var(--muted)}
.field{width:100%;padding:12px 13px;border:1px solid #d7d7dc;border-radius:12px;background:#fff;color:#17171b;margin:5px 0 10px;outline:none}
.field:focus{border-color:var(--blue)}
.primary{background:var(--blue);color:#fff;border-radius:12px;padding:11px 15px;font-weight:600}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 5px;border-bottom:1px solid var(--line);background:transparent;color:#222}
.item:last-child{border-bottom:0}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e3e3e8;flex-shrink:0;font-size:21px}
.bubble{padding:10px 13px;border-radius:18px;background:#e5e5ea;color:#111;margin:8px 0;max-width:85%;overflow-wrap:anywhere}
.bubble.me{margin-left:auto;background:#a2e6a0}
.pinpanel{position:absolute;inset:0;background:rgba(8,8,8,.94);backdrop-filter:blur(22px);z-index:20;display:none;text-align:center;padding-top:18%}
.pinpanel.show{display:block}
.pinpanel h2{font-weight:400}
.dots{letter-spacing:10px;font-size:23px;min-height:30px}
.error{height:20px;color:#ff9999;font-size:13px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;margin:20px auto}
.keypad button{aspect-ratio:1;border-radius:50%;background:#ffffff18;border:1px solid #ffffff35;font-size:24px}
.homebar{position:absolute;bottom:5px;left:calc(50% - 50px);width:100px;height:4px;border-radius:5px;background:#ffffffb5;z-index:22}
.hide{display:none!important}
.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.photoGrid button{aspect-ratio:1;background:linear-gradient(140deg,#d4b69a,#526270);font-size:30px;border-radius:4px}
.notice{font-size:12px;color:#777;line-height:1.5}
.section-label{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#777;margin:22px 5px 8px}
.setting-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:white;font-size:17px;flex-shrink:0}
.toggle{appearance:none;width:48px;height:29px;border-radius:20px;background:#d1d1d6;position:relative;flex-shrink:0;transition:.18s}
.toggle:checked{background:#34c759}
.toggle:before{content:"";position:absolute;width:25px;height:25px;top:2px;left:2px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:.18s}
.toggle:checked:before{left:21px}
/* Camera */
.camera-ui{background:#111;color:#fff;margin:-17px -16px -28px;min-height:calc(100dvh - 54px);padding:12px 15px 28px;display:flex;flex-direction:column}
.camera-view{background:#202024;border-radius:20px;overflow:hidden;min-height:48vh;display:grid;place-items:center;position:relative}
.camera-view video{width:100%;height:100%;min-height:48vh;object-fit:cover;position:absolute;inset:0}
.camera-placeholder{z-index:1;text-align:center;color:#c7c7cc;padding:20px}
.camera-tools{display:flex;justify-content:space-between;align-items:center;padding:18px 6px;color:#eee}
.shutter-row{display:flex;align-items:center;justify-content:center;gap:27px;padding:9px 0 22px}
.shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid #777;box-shadow:inset 0 0 0 3px #fff;color:#111;font-size:0}
.shutter:active{transform:scale(.94)}
.camera-small{width:42px;height:42px;border-radius:50%;background:#333;color:white;font-size:19px}
.camera-preview{width:42px;height:42px;border-radius:9px;background:#333;color:white;display:grid;place-items:center;overflow:hidden}
.camera-preview img{width:100%;height:100%;object-fit:cover}
.camera-action{background:#2a2a2e;color:#fff;border-radius:18px;padding:12px 15px;font-size:14px}
.camera-bottom{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.camera-ui .notice{color:#aaa;text-align:center}
/* Calculator */
.calc-wrap{background:#000;color:#fff;margin:-17px -16px -28px;min-height:calc(100dvh - 54px);padding:16px 18px 32px;display:flex;flex-direction:column;justify-content:flex-end}
.calc-display{width:100%;font-size:64px;letter-spacing:-2px;font-weight:300;background:none;color:#fff;border:0;text-align:right;padding:12px 6px 24px;min-height:120px}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.calc-key{aspect-ratio:1;border-radius:50%;font-size:27px;background:#333338;color:#fff;display:grid;place-items:center;transition:filter .1s}
.calc-key:active{filter:brightness(1.45)}
.calc-key.fn{background:#a5a5a8;color:#111}
.calc-key.op{background:var(--orange);color:#fff}
.calc-key.op.selected{background:#fff;color:var(--orange)}
.calc-key.zero{grid-column:span 2;aspect-ratio:auto;border-radius:50px;justify-content:start;padding-left:29px}
/* Gmail */
.mail-search{background:#e4e5eb;border-radius:15px;padding:12px 14px;color:#62636a;margin-bottom:16px}
.mail-row{display:flex;gap:12px;padding:14px 3px;border-bottom:1px solid #dedee4;color:#222;text-align:left;width:100%;background:none}
.mail-avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#6e78a8;font-weight:700;flex-shrink:0}
.mail-meta{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.mail-subject{font-size:14px;font-weight:650;margin:3px 0}
.mail-snippet{font-size:13px;color:#666;line-height:1.35}
.fab{position:absolute;bottom:28px;right:24px;border-radius:18px;background:#c6e7ff;color:#163a55;padding:14px 17px;box-shadow:0 4px 15px #0002;font-weight:600}
.mail-compose{background:#fff;border-radius:18px;padding:16px;margin-top:15px}
.mail-compose input,.mail-compose textarea{border:0;border-bottom:1px solid #e2e2e7;border-radius:0;padding:13px 3px;width:100%;color:#222;background:#fff;outline:none}
.mail-compose textarea{min-height:130px;resize:vertical}
@media(min-width:600px){#phone{height:min(900px,100dvh);border:5px solid #222;border-radius:32px}.camera-ui,.calc-wrap{min-height:calc(min(900px,100dvh) - 54px)}}
</style>
</head>
<body>
<div id="phone">
<div id="wall"></div>
<div class="status"><span id="clock">11:11</span><span>▮▮▮ ◉ ▰</span></div>

<section class="screen lock active" id="lock">
<img src="alohomora-lockscreen.jpg" alt="Alohomora lock screen" onerror="this.style.display='none';document.getElementById('fallback').classList.remove('hide')">
<div id="fallback" class="fallback hide">ALOHOMORA<br><small>MAVIN'S IPHONE</small></div>
<div class="lockdate" id="date"></div>
<div class="locktime" id="lockclock">11:11</div>
<button class="hint" id="unlock">↑ &nbsp; tap to unlock</button>
</section>

<section class="screen home" id="home">
<button class="weather" data-app="Weather">
<div class="city">Bandung</div><div class="temp">61°</div>
<div class="desc">☁<br>Cloudy<br>H:62° L:52°</div>
<div class="hours">
<div>2PM<b>☁</b>61°</div><div>3PM<b>☁</b>62°</div>
<div>4PM<b>☁</b>61°</div><div>5PM<b>☁</b>62°</div>
<div>6PM<b>☁</b>62°</div><div>7PM<b>☁</b>61°</div>
</div></button>
<div class="wlabel">Weather</div>

<div class="grid">
<button class="app" data-app="WhatsApp"><span class="ico wa">☎</span><label>WhatsApp</label></button>
<button class="app" data-app="Calendar"><span class="ico calendar"><small id="day">TUE</small><span id="num">9</span></span><label>Calendar</label></button>
<button class="app" data-app="Instagram"><span class="ico ig">◎</span><label>Instagram</label></button>
<button class="app" data-app="X"><span class="ico x">𝕏</span><label>X</label></button>
<button class="app" data-app="Spotify"><span class="ico spotify">●</span><label>Spotify</label></button>
<button class="app" data-app="Photos"><span class="ico photos">✿</span><label>Photos</label></button>
<button class="app" data-app="Notes"><span class="ico notes">▤</span><label>Notes</label></button>
<button class="app" data-app="YouTube"><span class="ico yt">▶</span><label>YouTube</label></button>
</div>

<div class="music" data-app="Music">
<div class="album">♫</div><div class="song">everything u are</div><div class="artist">Hindia</div>
<div class="bar"><i id="progress"></i></div>
<div class="track"><span>1:53</span><span>−2:04</span></div>
<div class="controls"><button data-control="prev">◀◀</button><button data-control="play">▶</button><button data-control="next">▶▶</button></div>
</div>
<div class="musiclabel">Music</div><div class="pages">● ○ ○</div>

<div class="dock">
<button class="app" data-app="Camera" aria-label="Camera"><span class="ico" style="background:#e7e7eb;color:#222">📷</span></button>
<button class="app" data-app="Calculator" aria-label="Calculator"><span class="ico" style="background:#ddd;color:#222">🧮</span></button>
<button class="app" data-app="Gmail" aria-label="Gmail"><span class="ico" style="background:#fff;color:#d44">✉</span></button>
<button class="app" data-app="Settings" aria-label="Settings"><span class="ico" style="background:#ddd;color:#222">⚙</span></button>
</div>
</section>

<section class="screen appscreen" id="app">
<div class="topbar"><button id="back">‹ Home</button><strong id="title">App</strong><span style="flex:1"></span><button id="lockBtn">Lock</button></div>
<div class="content" id="content"></div>
</section>

<div class="pinpanel" id="pin">
<h2>Enter Passcode</h2><p style="color:#ccc">Unlock Mavin's iPhone</p>
<div class="dots" id="dots">○ ○ ○ ○</div><div class="error" id="error"></div>
<div class="keypad" id="keys"></div>
<button id="cancel" style="background:none;color:#ddd">Cancel</button>
</div>
<div class="homebar" id="homebar"></div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let pin='',appName='',notes=load('mavin-notes',['Shot list: Gotham rooftops','Buy film for the camera','Daily Bugle deadline: submit photos']),events=load('mavin-events',[]),chats={},playing=false,calcExpr='',calcFresh=true,cameraStream=null,lastPhoto='';
function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function tick(){let d=new Date();$('#clock').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});$('#lockclock').textContent=$('#clock').textContent;$('#date').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});$('#day').textContent=d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase();$('#num').textContent=d.getDate()}
tick();setInterval(tick,15000);
function showPin(){pin='';drawPin();$('#error').textContent='';$('#pin').classList.add('show')}
function drawPin(){$('#dots').textContent=Array.from({length:4},(_,i)=>i<pin.length?'●':'○').join(' ')}
function home(){$('#pin').classList.remove('show');$('#lock').classList.remove('active');$('#app').classList.remove('active');$('#home').classList.add('active');stopCamera()}
function lock(){$('#pin').classList.remove('show');$('#home').classList.remove('active');$('#app').classList.remove('active');$('#lock').classList.add('active');stopCamera()}
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}}
$('#unlock').onclick=showPin;
$('#lock').onclick=e=>{if(e.target===$('#lock'))showPin()};
$('#cancel').onclick=()=>$('#pin').classList.remove('show');
for(let n=1;n<=9;n++){let b=document.createElement('button');b.textContent=n;b.onclick=()=>addPin(''+n);$('#keys').append(b)}
$('#keys').append(document.createElement('span'));
let z=document.createElement('button');z.textContent='0';z.onclick=()=>addPin('0');$('#keys').append(z);
let del=document.createElement('button');del.textContent='⌫';del.onclick=()=>{pin=pin.slice(0,-1);drawPin()};$('#keys').append(del);
function addPin(n){if(pin.length>=4)return;pin+=n;drawPin();if(pin.length===4){if(pin==='1711')setTimeout(home,160);else{$('#error').textContent='Incorrect passcode';setTimeout(()=>{pin='';drawPin()},650)}}}
$('#phone').addEventListener('click',e=>{const b=e.target.closest('[data-app]');if(!b||e.target.closest('[data-control]'))return;openApp(b.dataset.app)});
$('#back').onclick=home;$('#lockBtn').onclick=lock;
$('#homebar').onclick=()=>$('#app').classList.contains('active')?home():showPin();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openApp(n){appName=n;$('#title').textContent=n;$('#home').classList.remove('active');$('#app').classList.add('active');render(n)}

function render(n){
stopCamera();let c=$('#content');c.innerHTML='';
if(n==='Weather'){
c.innerHTML=`<div class="card" style="text-align:center;background:linear-gradient(140deg,#617d98,#263c51);color:white"><div>Bandung · Current weather</div><div style="font-size:65px;font-weight:250">61°</div>☁ Cloudy<p>H: 62° · L: 52°</p><p>Feels like 60° · Humidity 68% · Wind 8 km/h</p></div><h3>Hourly Forecast</h3><div class="card">2 PM ☁ 61°　3 PM ☁ 62°　4 PM ☁ 61°</div><h3>10-Day Forecast</h3>${['Today · Cloudy · 62° / 52°','Friday · Partly cloudy · 63° / 51°','Saturday · Light rain · 60° / 50°'].map(x=>`<div class="item">${x}</div>`).join('')}<p class="notice">Demo weather, not live data.</p>`
}
else if(n==='WhatsApp'){
let names=['Sal','Kinan','Opi','Daily Bugle Desk','Peter','Aunt May','MJ','Flash'];
c.innerHTML=`<h2>Chats</h2><input class="field" id="search" placeholder="⌕  Search chats"><div id="chatlist">${names.map((x,i)=>`<button class="item" data-chat="${x}"><span class="avatar">${['🌻','📚','☕','📰','📷','🏠','🎧','🕸️'][i]}</span><span style="flex:1;min-width:0"><b>${x}</b><br><span class="muted">${esc((chats[x]||['Hey, are we still on for today?']).slice(-1)[0])}</span></span><span class="muted" style="font-size:11px">10:${12+i}</span></button>`).join('')}</div>`;
$$('[data-chat]').forEach(b=>b.onclick=()=>chat(b.dataset.chat));
$('#search').oninput=e=>$$('[data-chat]').forEach(b=>b.classList.toggle('hide',!b.dataset.chat.toLowerCase().includes(e.target.value.toLowerCase())))
}
else if(n==='Calendar'){
let d=new Date(),m=new Date(d.getFullYear(),d.getMonth(),1);
c.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><button class="primary" id="prev">‹</button><h2 id="month"></h2><button class="primary" id="next">›</button></div><div class="card"><div id="calgrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center"></div></div><h3>Events</h3><div id="events"></div><input id="eventname" class="field" placeholder="Event title"><input id="eventdate" class="field" type="date" value="${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}"><button class="primary" id="addevent">＋ Add Event</button>`;

function calcPress(x,b){
let d=$('#display');
if(x==='AC'){calcExpr='';calcFresh=true;d.value='0';$$('[data-calc]').forEach(k=>k.classList.remove('selected'));return}
if(x==='⌫'){calcExpr=calcExpr.slice(0,-1);d.value=calcExpr||'0';return}
if(x==='±'){if(calcExpr.startsWith('-'))calcExpr=calcExpr.slice(1);else calcExpr='-'+calcExpr;d.value=calcExpr;return}
if(x==='%'){let v=Number(calcExpr||d.value);calcExpr=String(v/100);d.value=calcExpr;return}
if(x==='='){try{let q=calcExpr.replace(/[×÷−]/g,m=>({'×':'*','÷':'/','−':'-'}[m]));if(!/^[0-9+*/.() -]+$/.test(q))throw 0;let v=Function('return ('+q+')')();if(!Number.isFinite(v))throw 0;calcExpr=String(v);d.value=Number(v).toLocaleString('en-US',{maximumFractionDigits:8});calcFresh=true;$$('[data-calc]').forEach(k=>k.classList.remove('selected'))}catch{d.value='Error';calcExpr='';calcFresh=true}return}
if(['+','−','×','÷'].includes(x)){calcExpr+=x;calcFresh=false;$$('[data-calc]').forEach(k=>k.classList.remove('selected'));b.classList.add('selected')}
else{if(calcFresh){calcExpr='';calcFresh=false}calcExpr+=x;d.value=calcExpr}
if(!['+','−','×','÷'].includes(x))d.value=calcExpr||'0'
}
