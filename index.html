
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1b20">
<title>Mavin's iPhone</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: white;
  background: #171717;
  overflow: hidden;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

.phone {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  min-height: 580px;
  overflow: hidden;
  isolation: isolate;
  background: #b9a98e;
  user-select: none;
  -webkit-user-select: none;
}

.wallpaper {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

.shade {
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(180deg, #0002, transparent 45%, #0001);
}

/* STATUS BAR */

.status {
  position: absolute;
  z-index: 2;
  top: 0;
  left: 0;
  width: 100%;
  height: 44px;
  padding: 10px 7%;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  font-size: 15px;
  font-weight: 650;
  text-shadow: 0 1px 4px #0005;
}

.status-right {
  display: flex;
  align-items: center;
  gap: 5px;
}

.signal {
  display: flex;
  align-items: flex-end;
  height: 14px;
  gap: 2px;
}

.signal i {
  width: 3px;
  background: white;
  border-radius: 2px 2px 0 0;
}

.signal i:nth-child(1) { height: 5px; }
.signal i:nth-child(2) { height: 8px; }
.signal i:nth-child(3) { height: 11px; }
.signal i:nth-child(4) { height: 14px; }

.battery {
  position: relative;
  width: 22px;
  height: 12px;
  border: 1.5px solid white;
  border-radius: 3px;
}

.battery::before {
  content: "";
  position: absolute;
  right: -4px;
  top: 3px;
  width: 2px;
  height: 4px;
  background: white;
}

.battery::after {
  content: "";
  position: absolute;
  left: 2px;
  top: 2px;
  bottom: 2px;
  width: 70%;
  background: white;
  border-radius: 1px;
}

/* LOCK SCREEN */

.lock-screen {
  position: absolute;
  inset: 0;
  z-index: 20;
  overflow: hidden;
  background: #080808;
  transition: opacity .3s ease, visibility .3s ease;
  touch-action: pan-y;
}

.lock-wallpaper {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.lock-shade {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    rgba(0,0,0,.12),
    transparent 38%,
    rgba(0,0,0,.3)
  );
}

.lock-clock {
  position: absolute;
  top: 15%;
  width: 100%;
  text-align: center;
  text-shadow: 0 2px 12px #0003;
  pointer-events: none;
}

.lock-date {
  font-size: clamp(17px, 4.5vw, 21px);
  font-weight: 550;
  margin-bottom: 2px;
}

.lock-time {
  font-size: clamp(76px, 22vw, 100px);
  line-height: 1.05;
  font-weight: 250;
  letter-spacing: -4px;
}

.lock-bottom {
  position: absolute;
  bottom: max(22px, env(safe-area-inset-bottom));
  width: 100%;
  text-align: center;
  padding: 0 24px;
  pointer-events: none;
}

.lock-hint {
  font-size: 14px;
  margin-bottom: 19px;
  text-shadow: 0 1px 4px #0009;
}

.swipe-indicator {
  width: 112px;
  height: 5px;
  margin: 0 auto;
  border-radius: 10px;
  background: white;
  animation: floatUp 1.8s ease-in-out infinite;
}

@keyframes floatUp {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* PASSCODE */

.passcode-screen {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: none;
  flex-direction: column;
  align-items: center;
  padding: 12vh 30px 35px;
  background: rgba(28,27,32,.97);
}

.passcode-screen.active {
  display: flex;
}

.passcode-title {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 9px;
}

.passcode-subtitle {
  font-size: 14px;
  color: #ccc;
  margin-bottom: 24px;
  text-align: center;
}

.pin-dots {
  display: flex;
  gap: 17px;
  margin-bottom: 30px;
}

.pin-dot {
  width: 11px;
  height: 11px;
  border: 1px solid white;
  border-radius: 50%;
}

.pin-dot.filled {
  background: white;
}

.pin-pad {
  display: grid;
  grid-template-columns: repeat(3, 66px);
  gap: 12px 19px;
  justify-content: center;
}

.pin-key {
  width: 66px;
  height: 66px;
  border: 0;
  border-radius: 50%;
  background: #ffffff22;
  font-size: 27px;
  font-weight: 350;
}

.pin-key:active {
  background: #ffffff45;
}

.pin-key small {
  display: block;
  font-size: 8px;
  letter-spacing: 2px;
}

.pin-bottom {
  margin-top: auto;
  width: 100%;
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}

.pin-bottom button {
  border: 0;
  background: transparent;
}

.pin-error {
  min-height: 20px;
  font-size: 12px;
  color: #ffb4b4;
  margin-top: -21px;
  margin-bottom: 12px;
}

/* HOME SCREEN */

.home-screen {
  position: absolute;
  inset: 0;
  opacity: 0;
  visibility: hidden;
  transition: opacity .25s ease;
}

.home-screen.active {
  opacity: 1;
  visibility: visible;
}

/* WEATHER */

.weather-wrap {
  position: absolute;
  top: 8.2%;
  left: 8.7%;
  width: 82.6%;
}

.weather-card {
  width: 100%;
  height: clamp(174px, 24vh, 205px);
  padding: 12px 16px 10px;
  overflow: hidden;
  border-radius: 27px;
  background: linear-gradient(
    145deg,
    rgba(77,93,107,.96),
    rgba(31,48,62,.98)
  );
  box-shadow: 0 8px 22px #0002;
  display: flex;
  flex-direction: column;
}

.city {
  font-size: clamp(20px, 5.5vw, 26px);
  line-height: 1.2;
  font-weight: 600;
  flex-shrink: 0;
}

.weather-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  margin-top: 1px;
}

.temperature {
  font-size: clamp(49px, 13vw, 62px);
  line-height: 1.04;
  font-weight: 300;
  letter-spacing: -2px;
}

.condition {
  min-width: 90px;
  text-align: right;
  font-size: clamp(11px, 3.1vw, 14px);
  line-height: 1.35;
}

.condition strong {
  display: block;
  font-size: 23px;
  line-height: 1.1;
  font-weight: 500;
  margin-bottom: 3px;
}

.condition .high-low {
  white-space: nowrap;
}

.forecast {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  align-items: start;
  gap: 0;
  margin-top: auto;
  padding-top: 6px;
  text-align: center;
}

.forecast-item {
  display: flex;
  min-width: 0;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.forecast-time {
  font-size: clamp(10px, 3vw, 13px);
  line-height: 1.2;
  white-space: nowrap;
  color: #e3e7eb;
}

.cloud {
  position: relative;
  width: 27px;
  height: 19px;
  flex-shrink: 0;
}

.cloud::before {
  content: "";
  position: absolute;
  left: 2px;
  bottom: 2px;
  width: 23px;
  height: 10px;
  border-radius: 10px;
  background: white;
}

.cloud::after {
  content: "";
  position: absolute;
  left: 7px;
  bottom: 5px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: white;
  box-shadow: 7px 4px 0 -1px white;
}

.forecast-temp {
  font-size: clamp(11px, 3.1vw, 14px);
  line-height: 1.15;
  font-weight: 650;
}

.weather-label {
  margin-top: 5px;
  text-align: center;
  font-size: 12px;
  line-height: 1.2;
  text-shadow: 0 1px 4px #000a;
}

/* HOME GRID
   First row is positioned from the widget's actual bottom.
   The lower rows use the same vertical interval. */

.home-grid {
  position: absolute;
  top: 0;
  left: 7%;
  right: 7%;
  height: 100%;
  pointer-events: none;
}

.app,
.music-wrap {
  pointer-events: auto;
}

.app {
  position: absolute;
  width: 18%;
  padding: 0;
  border: 0;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

.app img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  border-radius: 22%;
  filter: drop-shadow(0 1px 2px #0002);
}

.app-name {
  width: 145%;
  text-align: center;
  font-size: clamp(11px, 3.2vw, 14px);
  line-height: 1.15;
  white-space: nowrap;
  text-shadow: 0 1px 4px #000d;
}

/* Music widget aligns with the first row */
.music-wrap {
  position: absolute;
  top: 37.2%;
  left: 50%;
  width: 50%;
  padding-left: 8px;
}

.whatsapp { left: 0; top: 37.2%; }
.calendar { left: 25%; top: 37.2%; }

.instagram { left: 0; top: calc(37.2% + 28vw); }
.xapp { left: 25%; top: calc(37.2% + 28vw); }

.spotify { left: 0; top: calc(37.2% + 52vw); }
.photos { left: 25%; top: calc(37.2% + 52vw); }
.notes { left: 50%; top: calc(37.2% + 52vw); }
.youtube { left: 75%; top: calc(37.2% + 52vw); }

.calendar-fallback {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 23%;
  background: white;
  color: #171717;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-size: clamp(25px, 7vw, 36px);
  font-weight: 800;
}

.calendar-fallback small {
  color: #d64545;
  font-size: 11px;
  font-weight: 850;
}

  
/* APPLE CALENDAR */
.apple-calendar {
  background: #fff;
  color: #1c1c1e;
  min-height: 100%;
  padding: 18px 14px 28px;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.cal-top {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 8px;
  margin-bottom: 24px;
}

.cal-label {
  color: #8e8e93;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
}

.cal-top h2 {
  font-size: 28px;
  margin: 5px 0 0;
  font-weight: 750;
}

.cal-top button {
  border: none;
  background: #f2f2f7;
  color: #007aff;
  border-radius: 50%;
  width: 34px;
  height: 34px;
  font-size: 24px;
}

.cal-weekdays,
.cal-days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  text-align: center;
}

.cal-weekdays {
  color: #8e8e93;
  font-size: 12px;
  margin-bottom: 12px;
}

.cal-weekdays span:first-child {
  color: #ff3b30;
}

.cal-day.sunday {
  color: #ff3b30;
}

.cal-day.sunday.today {
  color: #fff;
}
.cal-day.has-event {
  position: relative;
}

.cal-day.has-event::after {
  content: "";
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  bottom: 1px;
  left: 50%;
  transform: translateX(-50%);
  background: #8e8e93;
}

.cal-day.aespa-event::after {
  background: #ff2d55;
}

.cal-day.piw-event::after {
  background: #007aff;
}
.cal-days {
  row-gap: 12px;
}

.cal-day {
  border: 0;
  background: transparent;
  color: #1c1c1e;
  height: 36px;
  width: 36px;
  justify-self: center;
  border-radius: 50%;
  font-size: 14px;
}

.cal-day.today {
  background: #ff3b30;
  color: white;
  font-weight: 700;
}

.cal-day.selected:not(.today) {
  background: #e5e5ea;
  font-weight: 700;
}

.cal-agenda {
  border-top: 1px solid #e5e5ea;
  margin-top: 24px;
  padding-top: 16px;
}

.cal-agenda h3 {
  font-size: 19px;
  margin: 0 0 14px;
}

.cal-agenda input {
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d1d6;
  border-radius: 10px;
  font-size: 15px;
  margin-bottom: 8px;
}

.cal-agenda button {
  border: 0;
  border-radius: 10px;
  padding: 10px 14px;
  background: #007aff;
  color: white;
  font-size: 14px;
  font-weight: 600;
}

.cal-event {
  padding: 10px 0;
  border-bottom: 1px solid #e5e5ea;
  font-size: 14px;
}

/* MUSIC WIDGET: EXACT 1:1 */

.music-widget {
  width: 100%;
  aspect-ratio: 1 / 1;
  padding: clamp(8px, 2.2vw, 12px);
  border-radius: clamp(22px, 5vw, 30px);
  background: rgba(38,39,41,.97);
  box-shadow: 0 6px 20px #0003;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.music-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-shrink: 0;
  margin-bottom: 5px;
}

.album-art {
  display: block;
  width: 42%;
  aspect-ratio: 1 / 1;
  flex-shrink: 0;
  object-fit: cover;
  border-radius: 9px;
  background: #777;
}

.music-note {
  font-size: clamp(22px, 5vw, 30px);
  line-height: 1;
  padding: 2px 2px 0 0;
}

.track-title {
  font-size: clamp(11px, 3.4vw, 15px);
  line-height: 1.2;
  font-weight: 550;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.track-artist {
  font-size: clamp(10px, 3.1vw, 13px);
  line-height: 1.2;
  color: #d1d1d1;
  margin-top: 3px;
}

.progress-area {
  margin-top: auto;
  padding-top: 6px;
  flex-shrink: 0;
}

.progress-track {
  width: 100%;
  height: 5px;
  background: #777;
  border-radius: 10px;
  overflow: hidden;
}

.progress-fill {
  width: 48%;
  height: 100%;
  background: #eee;
  border-radius: inherit;
}

.track-times {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: clamp(10px, 2.8vw, 12px);
  line-height: 1.2;
  margin-top: 4px;
}

/* Each control has an identical grid cell and a centered SVG */
.music-controls {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  align-items: center;
  justify-items: stretch;
  width: 100%;
  margin-top: 6px;
  flex-shrink: 0;
}

.music-controls button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-width: 0;
  height: 27px;
  padding: 0;
  border: 0;
  background: transparent;
  color: white;
}

.music-controls svg {
  display: block;
  width: clamp(17px, 4.8vw, 23px);
  height: clamp(17px, 4.8vw, 23px);
  fill: currentColor;
  flex-shrink: 0;
}

.music-controls .play-button svg {
  width: clamp(22px, 6vw, 28px);
  height: clamp(22px, 6vw, 28px);
}

.music-controls .airplay svg {
  width: clamp(17px, 4.5vw, 21px);
  height: clamp(17px, 4.5vw, 21px);
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
}

.music-controls button:active {
  opacity: .55;
}

.music-label {
  margin-top: 5px;
  text-align: center;
  font-size: 12px;
  line-height: 1.2;
  text-shadow: 0 1px 4px #000c;
}

/* PAGE DOTS */

.page-dots {
  position: absolute;
  bottom: 15%;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 9px;
}

.page-dots span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ffffff80;
}

.page-dots span:first-child {
  background: white;
}

/* DOCK */

.dock {
  position: absolute;
  left: 7%;
  right: 7%;
  bottom: 3%;
  height: 9%;
  min-height: 68px;
  max-height: 92px;
  border-radius: 35px;
  background: rgba(190,177,154,.84);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  align-items: center;
  justify-items: center;
  padding: 7px 10px;
}

.dock button {
  width: 72%;
  max-width: 61px;
  padding: 0;
  border: 0;
  background: transparent;
}

.dock img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  border-radius: 23%;
}

/* DEMO APP WINDOWS */

.app-screen {
  position: absolute;
  inset: 0;
  z-index: 15;
  display: none;
  flex-direction: column;
  background: #f5f5f7;
  color: #222;
}

.app-screen.active {
  display: flex;
}

.app-header {
  min-height: 60px;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  gap: 16px;
  border-bottom: 1px solid #ddd;
  font-size: 18px;
  font-weight: 650;
}

.back-button {
  border: 0;
  background: transparent;
  color: #087bfa;
  font-size: 16px;
}

.app-content {
  padding: 20px;
  overflow: auto;
  flex: 1;
}

.demo-card {
  padding: 18px;
  border-radius: 16px;
  background: white;
  margin-bottom: 12px;
}

.demo-card textarea,
.demo-card input {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font: inherit;
}

.demo-card textarea {
  min-height: 110px;
}

.app-footer {
  padding: 12px;
  text-align: center;
  font-size: 12px;
  color: #888;
}

/* SHORTER SCREENS */

@media (max-height: 740px) {
  .weather-wrap {
    top: 7.5%;
  }

  .weather-card {
    height: 174px;
    padding-top: 10px;
    padding-bottom: 9px;
  }

  .home-grid {
    /* Keep a consistent gap below weather on shorter screens */
  }

  .music-widget {
    padding: 8px;
  }

  .music-controls {
    margin-top: 4px;
  }

  .music-controls button {
    height: 25px;
  }

  .page-dots {
    bottom: 13%;
  }

  .dock {
    bottom: 2%;
  }

  .lock-clock {
    top: 12%;
  }
}

@media (max-width: 360px) {
  .weather-card {
    padding-left: 11px;
    padding-right: 11px;
  }

  .music-wrap {
    padding-left: 5px;
  }

  .music-widget {
    padding: 7px;
    border-radius: 20px;
  }

  .track-title {
    font-size: 11px;
  }

  .music-controls button {
    height: 23px;
  }
}
</style>
</head>

<body>
<main class="phone">

  <!-- LOCK SCREEN -->
  <section class="lock-screen" id="lockScreen">
    <img
      class="lock-wallpaper"
      src="alohomora-lockscreen.jpg"
      alt="Lock screen wallpaper"
      onerror="this.style.display='none';document.getElementById('lockScreen').style.backgroundImage='linear-gradient(135deg,#665d50,#080808)'"
    >
    <div class="lock-shade"></div>

    <header class="status">
      <span id="lockStatusTime">10:24</span>
      <div class="status-right">
        <div class="signal"><i></i><i></i><i></i><i></i></div>
        <span>◔</span>
        <div class="battery"></div>
      </div>
    </header>

    <div class="lock-clock">
      <div class="lock-date" id="lockDate">Thursday, October 29</div>
      <div class="lock-time" id="lockTime">10:24</div>
    </div>

    <div class="lock-bottom">
      <div class="lock-hint">Swipe up to open</div>
      <div class="swipe-indicator" aria-hidden="true"></div>
    </div>
  </section>

  <!-- PASSCODE -->
  <section class="passcode-screen" id="passcodeScreen">
    <div class="passcode-title">Enter Passcode</div>
    <div class="passcode-subtitle">Enter your passcode to unlock iPhone</div>

    <div class="pin-dots" id="pinDots">
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
    </div>

    <div class="pin-error" id="pinError"></div>

let enteredPin = "";
let isPlaying = false;
let touchStartY = 0;
let touchStartX = 0;

function updateClock() {
  const now = new Date();

  const time = now.toLocaleTimeString("en-GB", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });

  document.getElementById("lockTime").textContent = time;
  document.getElementById("lockStatusTime").textContent = time;
  document.getElementById("homeStatusTime").textContent = time;

  document.getElementById("lockDate").textContent =
    now.toLocaleDateString("en-US", {
      weekday: "long",
      day: "numeric",
      month: "long"
    });
}

updateClock();
setInterval(updateClock, 30000);

/* SWIPE UP */

const lockScreen = document.getElementById("lockScreen");

lockScreen.addEventListener("touchstart", function(event) {
  if (document.getElementById("passcodeScreen").classList.contains("active")) return;

  const touch = event.changedTouches[0];
  touchStartY = touch.screenY;
  touchStartX = touch.screenX;
}, { passive: true });

lockScreen.addEventListener("touchend", function(event) {
  if (document.getElementById("passcodeScreen").classList.contains("active")) return;

  const touch = event.changedTouches[0];
  const deltaY = touchStartY - touch.screenY;
  const deltaX = Math.abs(touch.screenX - touchStartX);

  if (deltaY > 45 && deltaY > deltaX * 1.15) {
    showPasscode();
  }
}, { passive: true });

let mouseStartY = 0;

lockScreen.addEventListener("mousedown", function(event) {
  mouseStartY = event.clientY;
});

lockScreen.addEventListener("mouseup", function(event) {
  if (
    mouseStartY - event.clientY > 45 &&
    !document.getElementById("passcodeScreen").classList.contains("active")
  ) {
    showPasscode();
  }
});

/* PASSCODE */

function showPasscode() {
  enteredPin = "";
  updatePinDots();
  document.getElementById("pinError").textContent = "";
  document.getElementById("passcodeScreen").classList.add("active");
}

function hidePasscode() {
  document.getElementById("passcodeScreen").classList.remove("active");
}

function enterPin(number) {
  if (enteredPin.length >= 4) return;

  enteredPin += number;
  updatePinDots();

  if (enteredPin.length === 4) {
    if (enteredPin === CORRECT_PIN) {
      setTimeout(unlockPhone, 180);
    } else {
      document.getElementById("pinError").textContent =
        "Incorrect passcode. Try again.";

      setTimeout(() => {
        enteredPin = "";
        updatePinDots();
        document.getElementById("pinError").textContent = "";
      }, 650);
    }
  }
}

function deletePin() {
  enteredPin = enteredPin.slice(0, -1);
  updatePinDots();
  document.getElementById("pinError").textContent = "";
}

function updatePinDots() {
  document.querySelectorAll(".pin-dot").forEach((dot, index) => {
    dot.classList.toggle("filled", index < enteredPin.length);
  });
}

function unlockPhone() {
  document.getElementById("passcodeScreen").classList.remove("active");

  const lock = document.getElementById("lockScreen");
  lock.style.opacity = "0";
  lock.style.visibility = "hidden";

  document.getElementById("homeScreen").classList.add("active");
}

let cameraStream = null;
let cameraFacing = "environment";

async function openCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    alert("Kamera tidak didukung browser ini. Coba buka website lewat Chrome.");
    return;
  }

  const oldCamera = document.getElementById("cameraOverlay");
  if (oldCamera) oldCamera.remove();

  const overlay = document.createElement("div");
  overlay.id = "cameraOverlay";

  overlay.innerHTML = `
    <style>
      #cameraOverlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #000;
        color: white;
        display: flex;
        flex-direction: column;
        font-family: Arial, sans-serif;
      }
      #cameraOverlay .cam-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px;
      }
      #cameraOverlay button {
        border: 0;
        cursor: pointer;
        color: white;
        background: #292929;
        border-radius: 30px;
        padding: 12px 16px;
        font-size: 16px;
      }
      #cameraOverlay .cam-view {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #cameraOverlay video,
      #cameraOverlay .cam-result {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #cameraOverlay .cam-bottom {
        min-height: 100px;
        display: flex;
        align-items: center;
        justify-content: space-evenly;
        padding: 12px;
      }
      #cameraOverlay .shutter {
        width: 72px;
        height: 72px;
        padding: 0;
        border: 5px solid white;
        background: white;
        box-shadow: inset 0 0 0 3px #777;
      }
      #cameraOverlay .cam-hidden {
        display: none;
      }
    </style>

    <div class="cam-top">
      <button id="camClose">✕</button>
      <span>CAMERA</span>
      <button id="camSwitch">🔄</button>
    </div>

    <div class="cam-view">
      <video id="camVideo" autoplay playsinline></video>
      <img id="camResult" class="cam-result cam-hidden" alt="Hasil foto">
    </div>

    <div class="cam-bottom">
      <button id="camRetake" class="cam-hidden">Ulangi</button>
      <button id="camShutter" class="shutter" aria-label="Ambil foto"></button>
      <button id="camSave" class="cam-hidden">Simpan</button>
    </div>
  `;

  document.body.appendChild(overlay);

  const video = overlay.querySelector("#camVideo");
  const result = overlay.querySelector("#camResult");
  const shutter = overlay.querySelector("#camShutter");
  const switchButton = overlay.querySelector("#camSwitch");
  const retake = overlay.querySelector("#camRetake");
  const save = overlay.querySelector("#camSave");

  let photoData = null;

  async function startCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }

    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: cameraFacing }
        }
      });

      video.srcObject = cameraStream;
      await video.play();
    } catch (error) {
      alert("Kamera tidak bisa dibuka. Pastikan izin kamera diberikan ke browser.");
    }
  }

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }
  }

  overlay.querySelector("#camClose").onclick = () => {
    stopCamera();
    overlay.remove();
  };

  switchButton.onclick = async () => {
    cameraFacing =
      cameraFacing === "environment" ? "user" : "environment";
    await startCamera();
  };

  shutter.onclick = () => {
    if (!video.videoWidth) {
      alert("Tunggu sampai kamera siap dulu!");
      return;
    }

    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    canvas.getContext("2d").drawImage(
      video, 0, 0, canvas.width, canvas.height
    );

    photoData = canvas.toDataURL("image/jpeg", 0.92);
    result.src = photoData;
    result.classList.remove("cam-hidden");
    video.classList.add("cam-hidden");
    shutter.classList.add("cam-hidden");
    switchButton.classList.add("cam-hidden");
    retake.classList.remove("cam-hidden");
    save.classList.remove("cam-hidden");
    stopCamera();
  };

  retake.onclick = async () => {
    result.classList.add("cam-hidden");
    video.classList.remove("cam-hidden");
    shutter.classList.remove("cam-hidden");
    switchButton.classList.remove("cam-hidden");
    retake.classList.add("cam-hidden");
    save.classList.add("cam-hidden");
    photoData = null;
    await startCamera();
  };

  save.onclick = () => {
    if (!photoData) return;

    const link = document.createElement("a");
    link.href = photoData;
    link.download = `mavin-photo-${Date.now()}.jpg`;
    link.click();
  };

  await startCamera();
}

const weekday = new Date(year, month, day).getDay();

if (weekday === 0) {
  button.classList.add("sunday");
}
    const isToday =
      day === today.getDate() &&

      year === today.getFullYear();

    const isSelected =
      day === calendarSelectedDate.getDate() &&
      month === calendarSelectedDate.getMonth() &&
      year === calendarSelectedDate.getFullYear();

    if (isToday) button.classList.add("today");
    if (isSelected) button.classList.add("selected");

    button.onclick = () => {

    });

  const dateKey = [
    calendarSelectedDate.getFullYear(),
    String(calendarSelectedDate.getMonth() + 1).padStart(2, "0"),
    String(calendarSelectedDate.getDate()).padStart(2, "0")
  ].join("-");

  if (!calendarEvents[dateKey]) calendarEvents[dateKey] = [];
  calendarEvents[dateKey].push(input.value.trim());

  input.value = "";
  renderCalendarEvents();
}

function renderCalendarEvents() {
  const list = document.getElementById("calEventList");
  if (!list) return;

  const dateKey = [
    calendarSelectedDate.getFullYear(),
    String(calendarSelectedDate.getMonth() + 1).padStart(2, "0"),
    String(calendarSelectedDate.getDate()).padStart(2, "0")
  ].join("-");

  list.innerHTML = "";
if (
  calendarSelectedDate.getMonth() === 10 &&
  calendarSelectedDate.getDate() === 17
) {
  const item = document.createElement("div");
  item.className = "cal-event";
  item.textContent = "💗 aespa's Anniversary";
  list.appendChild(item);
}

if (
  calendarSelectedDate.getMonth() === 10 &&
  calendarSelectedDate.getDate() === 27
) {
  const item = document.createElement("div");
  item.className = "cal-event";
  item.textContent = "💌 piw's day";
  list.appendChild(item);
  }
  (calendarEvents[dateKey] || []).forEach(event => {
    const item = document.createElement("div");
    item.className = "cal-event";
    item.textContent = "• " + event;
    list.appendChild(item);
  });
}

function calculate() {
  const a = Number(document.getElementById("calcA").value);
  const b = Number(document.getElementById("calcB").value);

  document.getElementById("calcResult").textContent = "Result: " + (a + b);
}

function lockPhone() {
  closeApp();
  document.getElementById("homeScreen").classList.remove("active");

  const lock = document.getElementById("lockScreen");
  lock.style.visibility = "visible";
  lock.style.opacity = "1";

  hidePasscode();
  enteredPin = "";
  updatePinDots();
}
